<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://powbot.africa/tracker.html">
    <title>Submission tracker | PoWBoT</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/stats_emoji_32px.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/stats_emoji_16px.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/stats_emoji_180px.png">

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://powbot.africa/tracker.html">
    <meta property="og:title" content="PoW Submission Tracker">
    <meta property="og:description" content="Track PoW video submissions from review through payment.">
    <meta property="og:image" content="https://powbot.africa/images/PoWBoT_preview.jpg">

    <meta name="theme-color" content="#070F0B">
    <meta name="description" content="Every PoW video submission to PoWBoT, from review through payment.">

    <link rel="stylesheet" href="css/powbot.css">
    <style>
        /* Tracker layout only. Colours, type and components: css/powbot.css */

        /* ---------------------------------------------------------- Filters -- */
        .filters {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--s4);
            padding: var(--s5) 0;
        }
        .filters .field-search, #custom-date-range { grid-column: 1 / -1; }
        .date-range { display: grid; grid-template-columns: repeat(2, minmax(0, 14rem)); gap: var(--s4); }
        /* A filter that is narrowing the list gets a phosphor edge */
        .filters .active { border-color: var(--phosphor); }

        /* -------------------------------------------------- Count and pager -- */
        .results-bar {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: var(--s3) var(--s4);
            padding: var(--s3) 0;
            border-top: 1px solid var(--line);
        }
        .results-bar-bottom { margin-top: var(--s5); }
        .results-count { margin: 0; color: var(--muted); }
        .pager { display: flex; align-items: center; gap: var(--s3); }
        .pager[hidden] { display: none; }
        .page-info { font: 400 var(--fs-sm)/1.2 var(--font-mono); color: var(--muted); white-space: nowrap; }

        /* ------------------------------------------------------ Submissions -- */
        .submissions-list { display: grid; gap: var(--s2); margin: var(--s2) 0 0; padding: 0; list-style: none; }
        .submission-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
        .card-header {
            display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: var(--s2) var(--s4);
            width: 100%; min-height: var(--tap); padding: var(--s3) var(--s4);
            background: none; border: 0; color: inherit; text-align: left; cursor: pointer;
        }
        .card-header:hover { background: var(--panel-hi); }
        .card-header:hover .project-name .pn { text-decoration: underline; }
        .card-header[aria-expanded="true"] .chev { transform: rotate(225deg) translate(-2px, -2px); }
        .card-main { display: grid; gap: var(--s1); min-width: 0; }
        .card-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--s2); }
        .project-name { font: 700 var(--fs-md)/1.3 var(--font-text); color: var(--heading); overflow-wrap: anywhere; }
        .card-country { color: var(--muted); font-size: var(--fs-sm); }
        .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); color: var(--muted); font-size: var(--fs-sm); }
        .card-meta .merchant-name { color: var(--text); overflow-wrap: anywhere; }
        .card-meta .card-platform { color: var(--muted); }
        .card-meta time { font: 400 var(--fs-xs)/1.3 var(--font-mono); }

        .card-details { padding: var(--s2) var(--s4) var(--s4); border-top: 1px solid var(--line); background: var(--night); }
        .details { display: grid; gap: var(--s3); margin: var(--s3) 0 0; }
        .details dt { font: 700 var(--fs-sm)/1.2 var(--font-text); color: var(--muted); }
        .details dd { margin: var(--s1) 0 0; overflow-wrap: anywhere; }
        .payment-list { list-style: none; margin: var(--s1) 0 0; padding: 0; }
        .payment-item { display: flex; gap: 0 var(--s3); padding: var(--s1) 0; }
        .payment-type { flex: none; width: 6rem; color: var(--muted); }
        /* Values keep their column; a long post address wraps inside it */
        .payment-recipient { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .card-details .chips { margin-top: var(--s4); }

        /* ------------------------------------------------------------ States -- */
        .list-state { padding: var(--s6) 0; max-width: 60ch; }
        .list-state p { margin: 0 0 var(--s2); }
        .list-state p:first-child { font: 700 var(--fs-md)/1.4 var(--font-text); color: var(--text); }
        .list-state p + p { color: var(--muted); }

        @media (max-width: 720px) {
            .filters { grid-template-columns: minmax(0, 1fr); gap: var(--s3); padding: var(--s4) 0; }
            .date-range { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .results-bar { flex-direction: column; align-items: stretch; }
            .pager { justify-content: space-between; }
            .pager .btn { flex: 1; }
            .card-header { grid-template-columns: minmax(0, 1fr) auto; padding: var(--s3); }
            .card-header .status { grid-column: 1; grid-row: 2; justify-self: start; }
            .card-header .chev { grid-column: 2; grid-row: 1 / span 2; }
            .card-details { padding: var(--s2) var(--s3) var(--s4); }
        }
    </style>
</head>
<body class="pb">
    <!-- Navigation (loaded from includes/nav.html) -->
    <div id="site-nav"></div>

    <main id="main">
        <div class="wrap">
            <header class="page-head">
                <h1>Submission tracker</h1>
                <p class="lede">Every PoW video submission, from review through approval.</p>
            </header>

            <!-- Filters -->
            <div class="filters" role="search" aria-label="Filter submissions">
                <div class="field field-search">
                    <label class="field-label" for="filter-search">Search</label>
                    <input type="search" class="input" id="filter-search" placeholder="Project, merchant, notes or post URL" autocomplete="off">
                </div>

                <div class="field">
                    <label class="field-label" for="filter-epoch">Epoch</label>
                    <div class="select-wrap">
                        <select class="select" id="filter-epoch">
                            <option value="">All epochs</option>
                            <!-- Populated by JavaScript from the files loaded -->
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="filter-status">Status</label>
                    <div class="select-wrap">
                        <select class="select" id="filter-status">
                            <option value="">All statuses</option>
                            <option value="Pending Review">Pending review</option>
                            <option value="Approved">Approved, payment pending</option>
                            <option value="Processed">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="filter-project">Project</label>
                    <div class="select-wrap">
                        <select class="select" id="filter-project">
                            <option value="">All projects</option>
                            <!-- Populated by JavaScript -->
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="filter-date">Date range</label>
                    <div class="select-wrap">
                        <select class="select" id="filter-date">
                            <option value="all">All time</option>
                            <option value="today">Today</option>
                            <option value="7days">Last 7 days</option>
                            <option value="30days">Last 30 days</option>
                            <option value="custom">Custom range</option>
                        </select>
                    </div>
                </div>

                <!-- tracker.js shows this when "Custom range" is chosen -->
                <div id="custom-date-range" style="display: none;">
                    <div class="date-range">
                        <div class="field">
                            <label class="field-label" for="filter-date-from">From (UTC)</label>
                            <input type="date" class="input" id="filter-date-from">
                        </div>
                        <div class="field">
                            <label class="field-label" for="filter-date-to">To (UTC)</label>
                            <input type="date" class="input" id="filter-date-to">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Count and pager -->
            <div class="results-bar">
                <p class="results-count" id="results-count" role="status">Loading submissions…</p>
                <nav class="pager" id="pager-top" aria-label="Pages, top">
                    <button type="button" class="btn" id="btn-prev-page">Previous</button>
                    <span class="page-info">Page <span id="current-page">1</span> of <span id="total-pages">1</span></span>
                    <button type="button" class="btn" id="btn-next-page">Next</button>
                </nav>
            </div>

            <!-- Submissions -->
            <div id="submissions-container">
                <div class="list-state">
                    <p>Loading submissions…</p>
                </div>
            </div>

            <!-- Bottom pager -->
            <div class="results-bar results-bar-bottom" id="bottom-pagination" style="display: none;">
                <p class="results-count" id="results-count-bottom"></p>
                <nav class="pager" id="pager-bottom" aria-label="Pages, bottom">
                    <button type="button" class="btn" id="btn-prev-page-bottom">Previous</button>
                    <span class="page-info">Page <span id="current-page-bottom">1</span> of <span id="total-pages-bottom">1</span></span>
                    <button type="button" class="btn" id="btn-next-page-bottom">Next</button>
                </nav>
            </div>
        </div>
    </main>

    <!-- Footer will be injected here -->
    <div id="site-footer"></div>

    <!-- Defines fetchLiveData(). Must load BEFORE tracker.js, which calls it. -->
    <script src="epoch-config.js"></script>
    <script src="data-source.js"></script>
    <script src="flags.js"></script>
    <script src="tracker.js"></script>
    <!-- Shared nav (with the phone menu) and footer -->
    <script src="includes/inject.js"></script>
</body>
</html>
