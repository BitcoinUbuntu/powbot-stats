<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Project profile | PoWBoT</title>
    <meta name="description" id="page-description" content="A Bitcoin circular economy project in Africa: its story, its proof of work on PoWBoT, and how to donate to it directly over Lightning.">
    <link rel="canonical" id="page-canonical" href="https://powbot.africa/profile.html">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#C7F0D8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#37442F">
    <script>
        // Light or dark as chosen with the header switch, and screen effects if
        // turned off (both kept by includes/inject.js): applied before the page
        // first paints, so it never flashes the other way
        (function () {
            try {
                var theme = localStorage.getItem('pb-theme');
                if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
                if (localStorage.getItem('pb-screen-effects') === 'off') document.documentElement.classList.add('fx-off');
            } catch (e) { /* storage blocked: follow the device */ }
        })();
    </script>

    <!-- Open Graph / Social Preview (crawlers don't run JS, so these stay generic) -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="CBAF project profile | PoWBoT">
    <meta property="og:description" content="A Bitcoin circular economy project in Africa and its proof of work on PoWBoT.">
    <meta property="og:image" content="https://powbot.africa/images/PoWBoT_preview.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="32x32" href="images/stats_emoji_32px.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/stats_emoji_16px.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/stats_emoji_180px.png">

    <script src="qrcode.min.js"></script>
    <!-- The donation panel, shared with the directory card backs -->
    <script src="donate.js"></script>
    <script src="flags.js"></script>
    <!-- The current epoch's posts: live tracker data, grouped into visits -->
    <script src="epoch-config.js"></script>
    <script src="data-source.js"></script>
    <script src="visits.js"></script>

    <link rel="stylesheet" href="css/powbot.css">
    <style>
        /* Profile page layout only. Colours, type and components: css/powbot.css */

        /* ---------------------------------------------------------- Header -- */
        .profile-head { border-bottom: 1px solid var(--line); }
        .profile-head .wrap {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: var(--s5) var(--s6);
            align-items: center;
            padding-top: var(--s7);
            padding-bottom: var(--s6);
        }
        .hero-logo, .hero-logo-placeholder {
            display: block;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--panel);
            object-fit: cover;
        }
        .hero-logo-placeholder { display: flex; align-items: center; justify-content: center; font-size: var(--fs-2xl); }
        .hero-logo[hidden], .hero-logo-placeholder[hidden] { display: none; }
        .hero-text { min-width: 0; }
        .hero-text h1 { margin: 0; font-size: var(--fs-h1); overflow-wrap: anywhere; }
        .location { margin: var(--s2) 0 0; }
        .location .flag { margin-right: var(--s1); }
        .tagline { margin: var(--s3) 0 0; color: var(--muted); max-width: 70ch; }
        .hero-links { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0; padding: 0; list-style: none; }

        /* ------------------------------------------------ About and support -- */
        .intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); gap: var(--s6) var(--s7); align-items: start; }
        .intro-single { grid-template-columns: minmax(0, 1fr); }
        .intro h2 { margin: 0 0 var(--s3); font-size: 1.75rem; }
        .prose p { margin: 0 0 var(--s4); max-width: 70ch; }
        .prose p:last-child { margin-bottom: 0; }

        /* The donation panel's styles are shared: .donate* in css/powbot.css */

        /* ----------------------------------------------------------- Epochs -- */
        .section h3 { margin: var(--s6) 0 var(--s2); font-size: 1.375rem; }
        .section > h2 + h3 { margin-top: var(--s4); }
        .posts-more { margin-top: var(--s3); }
        /* Beside the tracker link, the row sets the spacing */
        .detail-links .posts-more { margin-top: 0; }
        .post-hidden { display: none !important; }

        /* ------------------------------------------------------ Achievements -- */
        .badges-grid { display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0; padding: 0; list-style: none; }
        .badge {
            display: inline-flex; align-items: center; gap: var(--s2);
            min-height: var(--tap); padding: var(--s1) var(--s3);
            border: 1px solid var(--line-strong); border-radius: var(--radius);
        }
        .badge-icon { font-size: var(--fs-md); line-height: 1; }
        .badge-text { min-width: 0; line-height: 1.35; }
        .badge-label { font-weight: 700; margin-right: var(--s1); }
        .badge-note { color: var(--muted); font-size: var(--fs-sm); }

        /* ----------------------------------------------------------- Gallery -- */
        /* A film strip: every photo whole, at one height, so portrait and
           landscape shots both show uncropped. It drifts slowly and loops
           (gallery script below); drag, swipe or scroll it sideways. */
        .gallery-strip { --gal-h: 300px; position: relative; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
        .gallery-strip.dragging { cursor: grabbing; }
        .gallery-track { display: flex; gap: var(--s3); width: max-content; }
        .gallery-set { display: flex; gap: var(--s3); margin: 0; padding: 0; list-style: none; }
        .gallery-set li { flex: none; }
        .gallery-set a { display: block; height: var(--gal-h); border-radius: var(--radius); }
        .gallery-set a:focus-visible { outline-offset: -3px; }
        .gallery-set img {
            display: block; height: 100%; width: auto; min-width: calc(var(--gal-h) * 0.5); max-width: none;
            background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
            user-select: none; -webkit-user-drag: none;
            transition: opacity var(--t-fast) ease;
        }
        .gallery-set a:hover img { opacity: 0.85; }
        .gallery-strip.dragging a { pointer-events: none; }
        .gallery-toggle[hidden] { display: none; }

        /* -------------------------------------------------- States and notes -- */
        .loading { margin: 0; padding: var(--s7) 0; color: var(--muted); }
        .page-error { padding-top: var(--s7); padding-bottom: var(--s7); }
        .page-error h1 { margin: 0 0 var(--s3); font-size: 2rem; }
        .page-error p { margin: 0; max-width: 60ch; }
        .page-error .muted { margin-top: var(--s2); }
        /* The rule runs the full width like the sections above; only the text is kept to a readable line length */
        .profile-footnote { padding: var(--s5) 0 var(--s6); border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-sm); }
        .profile-footnote p { margin: 0; max-width: 70ch; }

        @media (max-width: 720px) {
            .profile-head .wrap { grid-template-columns: 72px minmax(0, 1fr); gap: var(--s4); align-items: start; padding-top: var(--s6); padding-bottom: var(--s5); }
            .hero-logo, .hero-logo-placeholder { width: 72px; height: 72px; font-size: var(--fs-xl); }
            .intro { grid-template-columns: minmax(0, 1fr); }
            .gallery-strip { --gal-h: 200px; }
            .section { padding: var(--s6) 0; }
        }
    </style>
</head>
<body class="pb">
    <!-- Navigation (loaded from includes/nav.html) -->
    <div id="site-nav"></div>

    <main id="main">
        <div id="profile-content">
            <div class="wrap"><p class="loading">Loading the profile…</p></div>
        </div>

        <div class="wrap">
            <div class="profile-footnote" id="profile-footnote" hidden><p>
                Spot something wrong? Tell the <a href="https://t.me/bitcoinubuntu" target="_blank" rel="noopener" id="contact-admin-link">administrators on Telegram</a>. Registered project leads can <a href="#" id="edit-profile-link">sign in</a> to request changes.
            </p></div>
        </div>
    </main>

    <!-- Footer (loaded from includes/footer.html) -->
    <div id="site-footer"></div>

    <!-- Shared nav/footer injection - load first -->
    <script src="includes/inject.js"></script>

    <script>
        // Show profile footnote after profile loads
        function showEditLink(memberId) {
            const editLink = document.getElementById('edit-profile-link');
            const footnote = document.getElementById('profile-footnote');

            if (editLink && footnote) {
                editLink.href = `profile-edit.html?id=${encodeURIComponent(memberId)}`;
                footnote.style.display = 'block';
            }
        }
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const memberId = urlParams.get('id');

        if (!memberId) {
            document.getElementById('profile-content').innerHTML = `
                <div class="wrap page-error">
                    <h1>No project chosen</h1>
                    <p>This link does not name a project. Pick one from the <a href="members.html">project directory</a>.</p>
                </div>
            `;
        } else {
            loadProfile();
        }

        async function loadProfile() {
            try {
                // Load member data and stats in parallel
                const [membersData, statsEpoch4, statsEpoch5, statsHistorical, trackerLive] = await Promise.all([
                    fetch('members.json').then(r => r.json()),
                    fetch('stats-epoch4.json?t=' + Date.now()).then(r => r.json()).catch(() => null),
                    fetch('stats-epoch5.json?t=' + Date.now()).then(r => r.json()).catch(() => null),
                    fetch('stats-historical.json?t=' + Date.now()).then(r => r.json()).catch(() => null),
                    // The current epoch, live from the VPS with the repo copy as fallback
                    fetchLiveData('tracker-data.json').catch(() => null)
                ]);

                const member = membersData.members.find(m => m.id === memberId);
                if (!member) {
                    throw new Error('Member not found');
                }

                // Combine stats from all epochs
                const allStats = {
                    epoch4: statsEpoch4,
                    epoch5: statsEpoch5,
                    historical: statsHistorical,
                    tracker: trackerLive
                };

                // Update timestamp: the live tracker's, else the newest frozen epoch's
                const updatedAt = trackerLive?.last_updated || (statsEpoch5 || statsEpoch4)?.generated_at;
                if (updatedAt) {
                    const updatedElement = document.getElementById('updated');
                    if (updatedElement) {
                        updatedElement.textContent = new Date(updatedAt).toLocaleString('en-GB', { timeZone: 'UTC' }) + ' UTC';
                    }
                }

                renderProfile(member, allStats);
            } catch (err) {
                document.getElementById('profile-content').innerHTML = `
                    <div class="wrap page-error">
                        <h1>This profile could not load</h1>
                        <p>Check the link, or find the project in the <a href="members.html">project directory</a>.</p>
                        <p class="muted mono">${escapeHtml(err.message)}</p>
                    </div>
                `;
            }
        }

        // Escape HTML to prevent injection (for existing unescaped data)
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderProfile(member, allStats) {
            document.getElementById('page-title').textContent = `${member.name}${member.country ? ` – Bitcoin project in ${member.country}` : ''} | PoWBoT`;
            // Search engines render this page, so give each profile its own
            // description and canonical URL.
            if (member.tagline) document.getElementById('page-description').setAttribute('content', member.tagline.trim());
            document.getElementById('page-canonical').setAttribute('href', `https://powbot.africa/profile.html?id=${encodeURIComponent(member.id)}`);

            // Use logo from members.json, fallback to placeholder
            const logoUrl = member.logo_url || `images/members/${member.id}/logo.jpg`;
            const logoHtml = `
                <img src="${logoUrl}" alt="${escapeHtml(member.name)} logo" class="hero-logo" width="112" height="112"
                     onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
                <div class="hero-logo-placeholder" aria-hidden="true" hidden>${member.flag || escapeHtml(member.name.charAt(0))}</div>
            `;

            // Flag carries the country as its name; the country is also written out.
            const flagMarkup = flagHtml(member.flag, member.country, 'flag');
            const place = [member.city, member.country].filter(Boolean).join(', ');

            let html = `
                <header class="profile-head">
                    <div class="wrap">
                        ${logoHtml}
                        <div class="hero-text">
                            <h1>${escapeHtml(member.name)}</h1>
                            ${place || member.flag ? `<p class="location">${flagMarkup} ${escapeHtml(place)}</p>` : ''}
                            ${member.tagline ? `<p class="tagline">${escapeHtml(member.tagline)}</p>` : ''}
                        </div>
                        <ul class="hero-links" aria-label="${escapeHtml(member.name)} elsewhere">
            `;

            // Link chips. The emoji is decoration: each chip's text names it.
            const chip = (href, emoji, label, external = true) =>
                `<li><a href="${href}"${external ? ' target="_blank" rel="noopener"' : ''} class="hero-link"><span aria-hidden="true">${emoji}</span>${label}</a></li>`;

            if (member.website) {
                html += chip(escapeHtml(member.website), '🌐', 'Website');
            }

            if (member.x_profile) {
                html += chip(`https://x.com/${member.x_profile}`, '🐦', 'X');
            }

            if (member.npub && member.npub !== 'n/a') {
                html += chip(`https://primal.net/p/${escapeHtml(member.npub)}`, '⚡', 'Nostr');
            }

            if (member.email) {
                html += chip(`mailto:${escapeHtml(member.email)}`, '📧', 'Email', false);
            }

            if (member.btcmap_url) {
                html += chip(escapeHtml(member.btcmap_url), '🗺️', 'BTCMap');
            }

            if (member.btcpay_campaign) {
                html += chip(escapeHtml(member.btcpay_campaign), '💰', 'Crowdfund');
            }

            if (member.geyser_campaign) {
                html += chip(escapeHtml(member.geyser_campaign), '🌊', 'Geyser');
            }

            html += `
                        </ul>
                    </div>
                </header>

                <div class="wrap">
            `;

            // About, with the support box beside it.
            // No Lightning address means nothing to show: the onchain side is only
            // reachable from the Lightning side, so the box would render empty.
            // Drop it and let About span.
            const hasSupport = !!member.lightning_address;

            html += `<div class="section intro${hasSupport ? '' : ' intro-single'}">`;

            // About (first in reading order) - always show
            html += `
                <section aria-labelledby="about-title">
                    <h2 id="about-title">About</h2>
                    <div class="prose">
                        <p>${member.description ? escapeHtml(member.description) : 'Building a Bitcoin circular economy in ' + (member.city || member.country || 'Africa') + '.'}</p>
                    </div>
                </section>
            `;

            // Donation panel: the same as the back of a directory card
            if (hasSupport) {
                html += `
                <aside class="support" aria-labelledby="donate-lightning-title">
                    ${donatePanelHtml({
                        id: 'donate',
                        name: member.name,
                        lightning: member.lightning_address,
                        onchain: member.onchain_address || '',
                        level: 2,
                        // The page is already about this project
                        title: 'Donate'
                    })}
                </aside>`;
            }

            html += `</div>`; // Close intro

            // PoWBoT Stats - collect posts separately by epoch
            const epoch5Posts = [];
            const epoch4Posts = [];
            const historicalPosts = [];

            // Match project names ignoring the flag emoji and whitespace/case
            // differences. The old exact-string match (`name + flag`) broke
            // silently whenever a project's flag or name text was corrected
            // in members.json after an epoch's stats were generated - the
            // project simply vanished from that epoch's card, which looked
            // "empty" rather than erroring. Stripping the flag and
            // normalizing whitespace/case makes the join resilient to that.
            const normalizeProjectName = (name) => (name || '')
                .replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '') // strip regional-indicator flag chars
                .trim()
                .toLowerCase()
                .replace(/\s+/g, ' ');

            const statsName = normalizeProjectName(member.name);

            // Extract posts from Epoch 5 (current/live)
            if (allStats.epoch5 && allStats.epoch5.top_projects) {
                const epoch5Project = allStats.epoch5.top_projects.find(p => normalizeProjectName(p.name) === statsName);
                if (epoch5Project && epoch5Project.posts) {
                    epoch5Posts.push(...epoch5Project.posts);
                }
            }

            // Extract posts from Epoch 4
            if (allStats.epoch4 && allStats.epoch4.top_projects) {
                const epoch4Project = allStats.epoch4.top_projects.find(p => normalizeProjectName(p.name) === statsName);
                if (epoch4Project && epoch4Project.posts) {
                    epoch4Posts.push(...epoch4Project.posts);
                }
            }

            // Extract historical posts (Epochs 1-3 + Epoch 4 Testing)
            if (allStats.historical && allStats.historical.epochs) {
                const epochs = allStats.historical.epochs;
                ['epoch1', 'epoch2', 'epoch3', 'epoch4_testing'].forEach(epochKey => {
                    const epoch = epochs[epochKey];
                    if (epoch && epoch.top_projects) {
                        const project = epoch.top_projects.find(p => normalizeProjectName(p.name) === statsName);
                        if (project && project.posts) {
                            project.posts.forEach(post => {
                                historicalPosts.push({
                                    ...post,
                                    epoch: epoch.name,
                                    period: epoch.period
                                });
                            });
                        }
                    }
                });
            }

            // The current epoch, from the live tracker: approved posts only. The
            // tracker names projects "Bitbiashara (Kenya) 🇰🇪", so drop the country
            // before matching.
            const EPOCH = window.POWBOT_EPOCH || { number: 6, name: 'Epoch 6', start: '2026-07-20T06:00:00Z' };
            const currentSubs = allStats.tracker
                ? (allStats.tracker.submissions || []).filter(sub =>
                    sub.status === 'Processed'
                    && normalizeProjectName(String(sub.project_name).replace(/\s*\([^)]*\)/g, '')) === statsName)
                : null;
            const currentPosts = (currentSubs || []).map(sub => ({
                date: String(sub.timestamp).slice(0, 10), merchant: sub.merchant_name, url: sub.post_url
            }));

            // Calculate badges
            const badges = calculateBadges(epoch4Posts, epoch5Posts, historicalPosts, allStats, statsName, currentPosts);

            // Presentation helpers for the sections below
            const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
            const factsRow = (posts) => {
                const merchants = new Set(posts.map(p => p.merchant)).size;
                return `
                        <ul class="facts">
                            <li><b class="num">${posts.length}</b><span>${posts.length === 1 ? 'post' : 'posts'}</span></li>
                            <li><b class="num">${merchants}</b><span>${merchants === 1 ? 'merchant' : 'merchants'}</span></li>
                        </ul>`;
            };
            // Posts as visits (visits.js): an X post and its Nostr cross-post
            // share a row. Five show; the rest wait behind "Show N more".
            const merchantLink = name => name
                ? `<a href="merchant-profile.html?id=${encodeURIComponent(String(name).replace(/[^\w\s-]/g, '').trim().toLowerCase().replace(/\s+/g, '-'))}">${escapeHtml(name)}</a>`
                : 'A merchant';
            const visitItems = (visits, when) => visits.map((v, i) => `
                            <li class="post-item${i >= 5 ? ' post-hidden' : ''}"><div class="visit">
                                <span class="visit-main">${merchantLink(v.merchant)}</span>
                                ${visitLinks(v, `${member.name} at ${v.merchant || 'a merchant'}`)}
                                <span class="visit-when">${when(v)}</span>
                            </div></li>`).join('');
            // Frozen epochs carry a date per post, no time: they pair on the same or next day
            const datedVisits = posts => groupVisits(posts.map(post => ({
                project_name: member.name, merchant_name: post.merchant, post_url: post.url,
                timestamp: `${String(post.date).slice(0, 10)} 00:00:00 UTC`, classification: ''
            })));
            const dayOf = v => formatDate(String(v.first).slice(0, 10));

            // One post: platform as a text tag, then what, then when
            const postItem = (post, isHidden, name, when) => `
                            <li class="post-item${isHidden ? ' post-hidden' : ''}">
                                <a href="${escapeHtml(post.url)}" target="_blank" rel="noopener">
                                    <span class="tag">${escapeHtml(getPlatform(post.url).name)}</span>
                                    <span class="post-name">${escapeHtml(name)}</span>
                                    <span class="post-when">${escapeHtml(when)}</span>
                                </a>
                            </li>`;
            // "Show more" / "Show fewer" for the post lists, shared (visits.js)
            const moreButton = postsMoreButtons;

            // Render badges section if there are any badges
            if (badges.length > 0) {
                html += `
                    <section class="section" aria-labelledby="badges-title">
                        <h2 id="badges-title">Achievements</h2>
                        <p class="section-note">Earned across every PoWBoT epoch.</p>
                        <ul class="badges-grid">
                `;

                // The emoji is decoration: the label says the same thing.
                badges.forEach(badge => {
                    html += `
                            <li class="badge ${badge.type}">
                                <span class="badge-icon" aria-hidden="true">${badge.icon}</span>
                                <span class="badge-text"><span class="badge-label">${badge.label}</span>${badge.title ? ` <span class="badge-note">${escapeHtml(badge.title)}</span>` : ''}</span>
                            </li>
                    `;
                });

                html += `
                        </ul>
                    </section>
                `;
            }

            // The current epoch: one row per visit (visits.js), X and Nostr side by side
            if (currentSubs) {
                const visits = groupVisits(currentSubs);
                const initialCount = 5;
                const epochStart = new Date(EPOCH.start);
                const startLabel = epochStart.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
                const when = ts => {
                    const d = new Date(String(ts).replace(' UTC', 'Z').replace(' ', 'T'));
                    if (isNaN(d)) return '';
                    return `${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' })}, ${d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' })} UTC`;
                };
                const trackerHref = `tracker.html?${new URLSearchParams({ epoch: String(EPOCH.number), project: member.name, status: 'Processed' })}`;

                html += `
                    <section class="section" aria-labelledby="current-title">
                        <h2 id="current-title">${escapeHtml(EPOCH.name)}</h2>
                        <p class="section-note">The current epoch, since ${startLabel}. Live: approved posts appear here within minutes.</p>
                `;

                if (visits.length === 0) {
                    html += `<p>No approved posts yet this epoch.</p></section>`;
                } else {
                    html += factsRow(currentPosts);
                    html += `
                        <h3>Merchant posts, newest first</h3>
                        <p class="section-note">A visit posted on both X and Nostr shows once, with a link to each.</p>
                        <ul class="visits" id="posts-list-current">${visitItems(visits, v => when(v.first))}
                        </ul>
                        <div class="detail-links">
                            ${visits.length > initialCount ? moreButton('posts-list-current', visits.length - initialCount) : ''}
                            <a class="btn" href="${escapeHtml(trackerHref)}">All ${currentPosts.length} posts in the tracker</a>
                        </div>
                    </section>`;
                }
            }

            // Gallery (full-width, between the current epoch and Epoch 5)
            html += '<div id="gallery-placeholder"></div>';
            window.galleryMember = member;

            // Display Epoch 5 section
            if (epoch5Posts.length > 0) {
                epoch5Posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                const initialCount = 5;

                html += `
                    <section class="section" aria-labelledby="epoch5-title">
                        <h2 id="epoch5-title">Epoch 5</h2>
                        <p class="section-note">24 March – 3 July 2026</p>
                        ${factsRow(epoch5Posts)}
                `;

                const visits5 = datedVisits(epoch5Posts);
                html += `
                        <h3>Merchant posts, newest first</h3>
                        <ul class="visits dated" id="posts-list-epoch5">${visitItems(visits5, dayOf)}
                        </ul>`;

                // Epoch 5 is in the tracker as an archive (Epoch 4 and older are not)
                const tracker5 = `tracker.html?${new URLSearchParams({ epoch: '5', project: member.name, status: 'Processed' })}`;
                html += `
                        <div class="detail-links">
                            ${visits5.length > initialCount ? moreButton('posts-list-epoch5', visits5.length - initialCount) : ''}
                            <a class="btn" href="${escapeHtml(tracker5)}">All ${epoch5Posts.length} posts in the tracker</a>
                        </div>`;

                html += `</section>`;
            }

            // Display Epoch 4 section
            if (epoch4Posts.length > 0) {
                epoch4Posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                const initialCount = 5;

                html += `
                    <section class="section" aria-labelledby="epoch4-title">
                        <h2 id="epoch4-title">Epoch 4</h2>
                        <p class="section-note">13 January – 4 March 2026</p>
                        ${factsRow(epoch4Posts)}
                `;

                const visits4 = datedVisits(epoch4Posts);
                html += `
                        <h3>Merchant posts, newest first</h3>
                        <ul class="visits dated" id="posts-list-epoch4">${visitItems(visits4, dayOf)}
                        </ul>`;

                if (visits4.length > initialCount) {
                    html += `<div class="detail-links">${moreButton('posts-list-epoch4', visits4.length - initialCount)}</div>`;
                }

                html += `</section>`;
            }

            // Pre-PoWBoT History (Epochs 1-3 + Epoch 4 Testing)
            if (historicalPosts.length > 0) {
                // Sort in reverse chronological order (newest first) to match Epoch 4 section
                historicalPosts.reverse();
                    const initialHistoricalCount = 5;
                    const hasMoreHistorical = historicalPosts.length > initialHistoricalCount;

                    html += `
                        <section class="section" aria-labelledby="history-title">
                            <h2 id="history-title">Before PoWBoT</h2>
                            <p class="section-note">${plural(historicalPosts.length, 'post', 'posts')} from Epochs 1–3 and the Epoch 4 testing phase, newest first.</p>
                            <ul class="post-list" id="posts-list-historical">
                    `;

                    historicalPosts.forEach((post, index) => {
                        html += postItem(post, index >= initialHistoricalCount, post.epoch, post.period);
                    });

                    html += `</ul>`;

                    // Add "Show more" button if there are more than 5 posts
                    if (hasMoreHistorical) {
                        html += `<div class="detail-links">${moreButton('posts-list-historical', historicalPosts.length - initialHistoricalCount)}</div>`;
                    }

                    html += `</section>`;
            }

            html += `</div>`; // Close content wrap

            document.getElementById('profile-content').innerHTML = html;

            // Load gallery images (reads from gallery array)
            loadGalleryImages(member);

            // Draw the donation QR codes
            donateDrawQr(document.getElementById('donate'));

            // Show edit link
            showEditLink(member.id);
        }

        function loadGalleryImages(member) {
            const placeholder = document.getElementById('gallery-placeholder');
            if (!placeholder) return;

            // Check if member has gallery images (gallery array is source of truth)
            const galleryImages = member.gallery || [];

            if (galleryImages.length === 0) {
                placeholder.remove();
                return;
            }

            // A strip of photos, each a link that opens the full image in a new
            // tab. initGallery() adds the drift, the loop and the controls.
            const count = galleryImages.length;
            let galleryHtml = `
                <section class="section" aria-labelledby="gallery-title">
                    <div class="section-head">
                        <h2 id="gallery-title">Gallery</h2>
                        <button type="button" class="btn gallery-toggle" id="gallery-toggle" hidden>Pause<span class="visually-hidden"> gallery</span></button>
                    </div>
                    <div class="gallery-strip" id="gallery-strip">
                        <div class="gallery-track" id="gallery-track">
                            <ul class="gallery-set">
            `;

            galleryImages.forEach((imgPath, i) => {
                galleryHtml += `
                                <li>
                                    <a href="${imgPath}" target="_blank" rel="noopener" draggable="false">
                                        <img src="${imgPath}" alt="${escapeHtml(member.name)}, photo ${i + 1} of ${count}" draggable="false" decoding="async">
                                        <span class="visually-hidden">(opens full size in a new tab)</span>
                                    </a>
                                </li>
                `;
            });

            galleryHtml += `
                            </ul>
                        </div>
                    </div>
                </section>
            `;

            placeholder.outerHTML = galleryHtml;
            initGallery();
        }

        /**
         * The gallery strip drifts slowly to the left and loops: a copy of the
         * photos follows the originals, and the position wraps by one set's
         * width. The copy is inert, so keyboard and screen reader users meet
         * each photo once.
         *
         * It stops while hovered, dragged, holding keyboard focus, off screen or
         * in a background tab, and whenever Pause is on. Pause is on from the
         * start when the reader prefers reduced motion. Photos that all fit on
         * screen stay still, with no copy and no button.
         */
        function initGallery() {
            const strip = document.getElementById('gallery-strip');
            const track = document.getElementById('gallery-track');
            const set = track?.querySelector('.gallery-set');
            const toggle = document.getElementById('gallery-toggle');
            if (!strip || !set || !toggle) return;

            const SPEED = 10; // pixels per second
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            let copy = null, width = 0, pos = 0;
            let paused = reduceMotion.matches, hovered = false, focused = false, onScreen = true;
            let drag = null, suppressClick = false, frame = 0, last = 0;

            const wrap = () => { if (copy && width > 0) pos = ((pos % width) + width) % width; };
            const draw = () => { track.style.transform = `translate3d(${-pos}px, 0, 0)`; };
            const running = () => copy && !paused && !hovered && !focused && !drag && onScreen && !document.hidden;

            function step(now) {
                pos += SPEED * Math.min(now - last, 100) / 1000;
                last = now;
                wrap(); draw();
                frame = requestAnimationFrame(step);
            }
            function update() {
                if (running() && !frame) { last = performance.now(); frame = requestAnimationFrame(step); }
                if (!running() && frame) { cancelAnimationFrame(frame); frame = 0; }
            }
            function setPaused(value) {
                paused = value;
                toggle.firstChild.textContent = paused ? 'Play' : 'Pause';
                update();
            }

            // Loop only when the photos are wider than the strip
            function measure() {
                const loops = set.scrollWidth > strip.clientWidth + 1;
                if (loops && !copy) {
                    copy = set.cloneNode(true);
                    copy.inert = true;
                    copy.setAttribute('aria-hidden', 'true');
                    track.appendChild(copy);
                } else if (!loops && copy) {
                    copy.remove(); copy = null; pos = 0;
                }
                width = copy ? copy.offsetLeft - set.offsetLeft : 0;
                toggle.hidden = !copy;
                wrap(); draw(); update();
            }

            toggle.addEventListener('click', () => setPaused(!paused));
            reduceMotion.addEventListener?.('change', e => { if (e.matches) setPaused(true); });

            strip.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { hovered = true; update(); } });
            strip.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { hovered = false; update(); } });

            // Keyboard: pause, and bring the focused photo fully into view
            strip.addEventListener('focusin', e => {
                focused = true;
                const link = e.target.closest('a');
                if (link && !copy?.contains(link)) {
                    // Positions within the original set, before the drift's transform
                    const x = link.offsetLeft - set.offsetLeft;
                    const w = link.offsetWidth, fit = strip.clientWidth;
                    if (x < pos) pos = x;                                          // cut off on the left
                    else if (x + w > pos + fit) pos = Math.min(x, x + w - fit);    // cut off on the right
                    draw();
                    strip.scrollLeft = 0;
                }
                update();
            });
            strip.addEventListener('focusout', e => { if (!strip.contains(e.relatedTarget)) { focused = false; update(); } });
            // Focusing a photo also makes the browser scroll the strip itself, on
            // top of the transform above. The strip only ever moves by transform.
            strip.addEventListener('scroll', () => { if (strip.scrollLeft) strip.scrollLeft = 0; });

            // Drag with a mouse, or swipe sideways; vertical swipes still scroll the page
            strip.addEventListener('pointerdown', e => {
                if (!copy || e.button !== 0) return;
                drag = { id: e.pointerId, x: e.clientX, pos, moved: false };
                update();
            });
            strip.addEventListener('pointermove', e => {
                if (!drag || e.pointerId !== drag.id) return;
                const dx = e.clientX - drag.x;
                if (!drag.moved && Math.abs(dx) > 5) {
                    drag.moved = true;
                    strip.setPointerCapture(e.pointerId);
                    strip.classList.add('dragging');
                }
                if (drag.moved) { pos = drag.pos - dx; wrap(); draw(); }
            });
            const endDrag = e => {
                if (!drag || e.pointerId !== drag.id) return;
                if (drag.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }
                strip.classList.remove('dragging');
                drag = null;
                update();
            };
            strip.addEventListener('pointerup', endDrag);
            strip.addEventListener('pointercancel', endDrag);
            // On a desktop, pressing on a link and moving starts the browser's own
            // drag-and-drop of the link, which cancels ours. Links in the strip
            // are not draggable (draggable="false"), and this catches any other.
            strip.addEventListener('dragstart', e => e.preventDefault());
            // A drag that ends over a photo is not a click on it
            strip.addEventListener('click', e => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); } }, true);

            // Sideways scrolling on a trackpad moves the strip too
            strip.addEventListener('wheel', e => {
                if (!copy || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
                e.preventDefault();
                pos += e.deltaX; wrap(); draw();
            }, { passive: false });

            if ('IntersectionObserver' in window) {
                new IntersectionObserver(entries => { onScreen = entries[0].isIntersecting; update(); }).observe(strip);
            }
            document.addEventListener('visibilitychange', update);
            if ('ResizeObserver' in window) new ResizeObserver(measure).observe(strip);
            set.querySelectorAll('img').forEach(img => { if (!img.complete) img.addEventListener('load', measure, { once: true }); });

            setPaused(paused);
            measure();
        }

        // currentPosts: the live epoch's approved posts ({date, merchant, url}).
        // They count towards every badge except the rankings, which use
        // finished epochs only: a live ranking changes by the day.
        function calculateBadges(epoch4Posts, epoch5Posts, historicalPosts, allStats, statsName, currentPosts = []) {
            // Mirrors normalizeProjectName() above (flag-agnostic name match),
            // duplicated here since this function has its own scope.
            const normalizeProjectName = (name) => (name || '')
                .replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '')
                .trim()
                .toLowerCase()
                .replace(/\s+/g, ' ');

            const badges = [];

            // Total posts across all epochs
            const totalPosts = epoch4Posts.length + epoch5Posts.length + currentPosts.length + historicalPosts.length;

            // Activity Milestones
            if (totalPosts >= 500) {
                badges.push({ icon: '💎', label: 'Diamond status', type: 'activity', title: '500+ posts' });
            } else if (totalPosts >= 100) {
                badges.push({ icon: '⭐', label: 'Rising star', type: 'activity', title: '100+ posts' });
            } else if (totalPosts >= 50) {
                badges.push({ icon: '🚀', label: 'On fire', type: 'activity', title: '50+ posts' });
            } else if (totalPosts >= 10) {
                badges.push({ icon: '🌱', label: 'First steps', type: 'activity', title: '10+ posts' });
            } else if (totalPosts >= 1) {
                badges.push({ icon: '👋', label: 'First post', type: 'activity', title: 'First approved post' });
            }

            // Community Impact - unique merchants across the PoWBoT epochs (4 onwards)
            const powbotPosts = [...epoch4Posts, ...epoch5Posts, ...currentPosts];
            if (powbotPosts.length > 0) {
                const uniqueMerchants = new Set(powbotPosts.map(p => p.merchant)).size;

                if (uniqueMerchants >= 25) {
                    badges.push({ icon: '🌍', label: 'Network connector', type: 'community', title: '25+ unique merchants' });
                } else if (uniqueMerchants >= 15) {
                    badges.push({ icon: '🏪', label: 'Merchant champion', type: 'community', title: '15+ unique merchants' });
                } else if (uniqueMerchants >= 5) {
                    badges.push({ icon: '🤝', label: 'Community builder', type: 'community', title: '5+ unique merchants' });
                }
            }

            // Platform Diversity - active on both X and Nostr
            const allPosts = powbotPosts;
            if (allPosts.length > 0) {
                const hasXPosts = allPosts.some(p => {
                    const url = p.url ? p.url.toLowerCase() : '';
                    return url.includes('twitter.com') || url.includes('x.com');
                });
                const hasNostrPosts = allPosts.some(p => {
                    const url = p.url ? p.url.toLowerCase() : '';
                    return url.includes('primal.net') || url.includes('njump') || (!url.includes('twitter.com') && !url.includes('x.com'));
                });

                if (hasXPosts && hasNostrPosts) {
                    badges.push({ icon: '🎯', label: 'All-rounder', type: 'consistency', title: 'Active on X and Nostr' });
                }
            }

            // Daily Posting Streaks - calculate best streak across all epochs
            const calculateStreak = (posts) => {
                if (posts.length === 0) return 0;

                const dates = posts.map(p => p.date.split('T')[0]).sort();
                const uniqueDates = [...new Set(dates)];

                let maxStreak = 1;
                let currentStreak = 1;

                for (let i = 1; i < uniqueDates.length; i++) {
                    const prevDate = new Date(uniqueDates[i - 1]);
                    const currDate = new Date(uniqueDates[i]);
                    const dayDiff = Math.floor((currDate - prevDate) / (1000 * 60 * 60 * 24));

                    if (dayDiff === 1) {
                        currentStreak++;
                        maxStreak = Math.max(maxStreak, currentStreak);
                    } else {
                        currentStreak = 1;
                    }
                }

                return maxStreak;
            };

            // Calculate best streak from each epoch
            const epoch4Streak = calculateStreak(epoch4Posts);
            const epoch5Streak = calculateStreak(epoch5Posts);
            const currentStreak = calculateStreak(currentPosts);
            const bestStreak = Math.max(epoch4Streak, epoch5Streak, currentStreak);

            // Award streak badges based on best achievement
            if (bestStreak >= 21) {
                badges.push({ icon: '💪', label: '21-day streak', type: 'activity', title: 'Posted for 21+ consecutive days' });
            } else if (bestStreak >= 14) {
                badges.push({ icon: '⚡', label: '14-day streak', type: 'activity', title: 'Posted for 14+ consecutive days' });
            } else if (bestStreak >= 7) {
                badges.push({ icon: '🔥', label: '7-day streak', type: 'activity', title: 'Posted for 7+ consecutive days' });
            }

            // Legacy & Tenure
            if (historicalPosts.length > 0) {
                // Get unique epoch names
                const epochNames = new Set(historicalPosts.map(p => p.epoch));

                // Founding Member - participated in Epoch 1 (May 2025, the very first)
                if (epochNames.has('Epoch 1')) {
                    badges.push({ icon: '👑', label: 'Founding member', type: 'excellence', title: 'Participated in Epoch 1' });
                }

                // Early Adopter - participated in Epoch 2 or 3 (Aug/Nov 2025)
                if (epochNames.has('Epoch 2') || epochNames.has('Epoch 3')) {
                    badges.push({ icon: '🏆', label: 'Early adopter', type: 'legacy', title: 'Participated before PoWBoT' });
                }

                // Beta Tester - participated in Epoch 4 Testing
                if (epochNames.has('Epoch 4 Testing')) {
                    badges.push({ icon: '🧪', label: 'Beta tester', type: 'activity', title: 'Helped test PoWBoT' });
                }

            }

            // Multi-Epoch Veteran - active in 3+ epochs, counting the live one
            // (the Epoch 4 testing phase counts as its own, as it always has)
            const epochsActive = new Set(historicalPosts.map(p => p.epoch)).size
                + [epoch4Posts, epoch5Posts, currentPosts].filter(posts => posts.length > 0).length;
            if (epochsActive >= 3) {
                badges.push({ icon: '🛡️', label: 'Multi-epoch veteran', type: 'consistency', title: 'Active across 3+ epochs' });
            }

            // Excellence - ranking based on Epoch 4 and 5 data
            const epoch4Ranking = allStats.epoch4?.top_projects?.findIndex(p => normalizeProjectName(p.name) === statsName) ?? -1;
            const epoch5Ranking = allStats.epoch5?.top_projects?.findIndex(p => normalizeProjectName(p.name) === statsName) ?? -1;

            // Use the best ranking achieved across epochs
            const bestRanking = epoch4Ranking >= 0 && epoch5Ranking >= 0
                ? Math.min(epoch4Ranking, epoch5Ranking)
                : epoch4Ranking >= 0 ? epoch4Ranking : epoch5Ranking;

            // Build title showing all rankings achieved
            const buildTitle = () => {
                const in4 = epoch4Ranking >= 0 && epoch4Ranking < 10;
                const in5 = epoch5Ranking >= 0 && epoch5Ranking < 10;

                // Same ranking in both epochs
                if (in4 && in5 && epoch4Ranking === epoch5Ranking) {
                    return `#${epoch4Ranking + 1} in Epoch 4 and 5`;
                }

                // Different rankings
                const parts = [];
                if (in4) parts.push(`#${epoch4Ranking + 1} in Epoch 4`);
                if (in5) parts.push(`#${epoch5Ranking + 1} in Epoch 5`);
                return parts.join(', ');
            };

            if (bestRanking === 0) {
                badges.push({ icon: '🥇', label: 'Top performer', type: 'excellence', title: buildTitle() });
            } else if (bestRanking === 1) {
                badges.push({ icon: '🥈', label: '2nd place', type: 'excellence', title: buildTitle() });
            } else if (bestRanking === 2) {
                badges.push({ icon: '🥉', label: '3rd place', type: 'excellence', title: buildTitle() });
            } else if (bestRanking >= 0 && bestRanking < 10) {
                badges.push({ icon: '🏅', label: 'Top 10', type: 'excellence', title: buildTitle() });
            }

            return badges;
        }


        function getPlatform(url) {
            if (!url) return { name: 'Nostr', icon: '🟣' };
            const lower = url.toLowerCase();
            if (lower.includes('twitter.com') || lower.includes('x.com')) return { name: 'X', icon: '𝕏' };
            return { name: 'Nostr', icon: '🟣' };
        }

        // "2026-07-03" -> "3 Jul 2026", read as a UTC date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
        }

        function copyToClipboard(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                alert(`${label} copied!\n\n${text}`);
            });
        }
    </script>
