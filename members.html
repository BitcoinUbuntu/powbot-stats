<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBAF members – Bitcoin projects across Africa | PoWBoT</title>
    <meta name="description" content="Directory of grassroots Bitcoin circular economy projects across Africa. See each project’s proof of work on PoWBoT and donate to it directly over Lightning.">
    <link rel="canonical" href="https://powbot.africa/members.html">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#C7F0D8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#37442F">
    <link rel="icon" type="image/png" sizes="32x32" href="images/stats_emoji_32px.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/stats_emoji_16px.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/stats_emoji_180px.png">

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://powbot.africa/members.html">
    <meta property="og:title" content="CBAF Members Directory">

    <meta name="twitter:image" content="https://powbot.africa/images/PoWBoT_preview.jpg">

    <script src="qrcode.min.js"></script>

    <script src="donate.js"></script>
    <script src="flags.js"></script>

         the head because this page's inline script runs before inject.js. -->
    <script src="data-source.js"></script>

    <link rel="stylesheet" href="css/powbot.css">
    <style>
        /* Directory layout only. Colours, type and components: css/powbot.css */
        .page-head { padding: var(--s7) 0 var(--s6); border-bottom: 1px solid var(--line); }
        .page-head h1 { margin: 0; font-size: var(--fs-h1); }
        .page-head .lede { margin: var(--s3) 0 var(--s5); color: var(--muted); max-width: 60ch; font-size: var(--fs-md); }

        /* Controls */
        .controls { display: grid; gap: var(--s4); padding: var(--s5) 0; }
        .controls-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s4); }
        .field { display: grid; gap: 6px; min-width: 0; }
        .field-label { font: 700 var(--fs-sm)/1.2 var(--font-text); color: var(--muted); }
        .field-search { flex: 1 1 100%; max-width: 40rem; }
        .field-select { flex: 1 1 11rem; max-width: 16rem; }
        .input, .select {
            width: 100%; min-height: var(--tap); padding: 0 var(--s3);
            background: var(--panel); color: var(--text);
            border: 1px solid var(--line-strong); border-radius: var(--radius);
            font: 400 var(--fs-base)/1.2 var(--font-text);
        }
        .input::placeholder { color: var(--muted); opacity: 1; }
        .input:hover, .select:hover { border-color: var(--muted); }
        .select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer; color-scheme: dark; }
        .select option { background: var(--panel); color: var(--text); }
        .select.active { border-color: var(--link); }
        .select-wrap { position: relative; }
        .select-wrap::after {
            content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
            border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
            transform: rotate(45deg); pointer-events: none;
        }

        /* Filter buttons: the shared .seg, laid out as a grid so it can wrap to 2 x 2 */
        .filters.seg { display: inline-grid; grid-auto-flow: column; gap: 1px; background: var(--line-strong); }
        .filters.seg button { border: 0; }
        .filters.seg button:not([aria-pressed="true"]) { background: var(--night); }

        /* Member grid. Every card is the same height on both faces, whichever
           address is showing: the content is sized to fit it, not the other
           way round, so flipping or switching address never moves the grid. */
        .members-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
            gap: var(--s4); padding-bottom: var(--s7);
        }
        .member-card { --card-h: 25rem; height: var(--card-h); min-width: 0; perspective: 1200px; }
        .card-inner {
            position: relative; height: 100%;
            transform-style: preserve-3d;
            transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .member-card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; inset: 0; overflow: hidden;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
        }
        /* The back is the shared donation panel (css/powbot.css), filling the card */
        .card-back { transform: rotateY(180deg); background: none; border: 0; }
        .card-back .donate { height: 100%; }

        /* Front */
        .card-front { display: flex; flex-direction: column; cursor: pointer; }
        .card-front:hover { border-color: var(--line-strong); }
        .card-header {
            flex: none; display: flex; align-items: center; justify-content: center;
            height: 6.5rem; background: var(--panel-hi); border-bottom: 1px solid var(--line);
        }
        .card-logo, .card-logo-placeholder {
            flex: none; width: 80px; height: 80px; border-radius: 50%;
            border: 1px solid var(--line-strong); background: var(--night);
        }
        .card-logo { object-fit: cover; }
        .card-logo-placeholder { display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .card-logo-placeholder[hidden] { display: none; }
        .card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); }
        .card-title { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); min-width: 0; }
        .card-title h3 { margin: 0; font: 700 var(--fs-md)/1.25 var(--font-text); letter-spacing: 0; overflow-wrap: anywhere; }
        .card-title .flag { flex: none; font-size: 1.5rem; line-height: 1; }
        .card-place { margin: 2px 0 0; color: var(--muted); font-size: var(--fs-sm); }
        .card-tagline {
            margin: 0; color: var(--muted); font-size: var(--fs-sm); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-footer { display: grid; gap: var(--s2); margin-top: auto; }
        .post-count { margin: 0; color: var(--muted); font-size: var(--fs-sm); min-height: 1.4em; }
        .post-count b { font: 700 var(--fs-md)/1 var(--font-mono); color: var(--text); letter-spacing: -0.02em; margin-right: 4px; }
        /* One row, always: a card never grows a line for its badges */
        .badge-emojis { display: flex; gap: 6px; margin: 0; min-height: 1.3em; overflow: hidden; font-size: 1.05rem; line-height: 1.2; }
        .card-actions { display: flex; gap: var(--s2); margin-top: var(--s1); }
        .card-actions .btn { flex: 1; min-width: 0; }
        /* .pb button resets font and colour, which would override .btn on <button> */
        .pb button.btn { font: 400 var(--fs-sm)/1.2 var(--font-mono); color: var(--link); }
        .pb button.btn:hover { color: var(--night); }
        /* Donate is the card's one highlight: a solid block */
        .pb button.btn-donate { background: var(--accent); color: var(--night); }
        .pb button.btn-donate:hover { background: var(--accent-hi); }
        .pb button.btn-donate:focus-visible { outline-color: var(--link); }

        /* States */
        .loading, .empty-state { grid-column: 1 / -1; padding: var(--s7) 0; color: var(--muted); }
        .empty-state h3 { margin: 0 0 var(--s2); color: var(--heading); font: 700 var(--fs-md)/1.4 var(--font-text); }
        .empty-state p { margin: 0; }
        .empty-state .err-detail { margin-top: var(--s2); font: 400 var(--fs-xs)/1.4 var(--font-mono); }

        @media (max-width: 720px) {
            .page-head { padding: var(--s6) 0 var(--s5); }
            .page-head .lede { font-size: var(--fs-base); }
            .field-filter, .filters.seg { width: 100%; }
            .filters.seg { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
            .filters.seg button { padding: var(--s2) var(--s3); line-height: 1.2; }
            .field-select { max-width: none; }
        }
    </style>
</head>
<body class="pb">
    <!-- Navigation (loaded from includes/nav.html) -->
    <div id="site-nav"></div>

    <main id="main">
        <div class="wrap">
            <header class="page-head">
                <h1>CBAF members</h1>
                <p class="lede">Find a Bitcoin circular economy project in Africa and support it directly.</p>
                <ul class="facts">
                    <li><b class="num" id="total-count">–</b><span>projects</span></li>
                    <li><b class="num" id="active-count">–</b><span>active on PoWBoT</span></li>
                    <li><b class="num" id="country-count">–</b><span>countries</span></li>
                </ul>
            </header>

            <div class="controls">
                <div class="controls-row">
                    <div class="field field-search">
                        <label class="field-label" for="search">Search projects</label>
                        <input class="input" type="search" id="search" placeholder="Name, country or city" autocomplete="off">
                    </div>
                </div>
                <div class="controls-row">
                    <div class="field field-filter">
                        <span class="field-label" id="filter-label">Show</span>
                        <div class="seg filters" role="group" aria-labelledby="filter-label">
                            <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All projects</button>
                            <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active on PoWBoT</button>
                            <button type="button" class="filter-btn" data-filter="epoch6" aria-pressed="false">Active this epoch</button>
                            <button type="button" class="filter-btn" data-filter="top" aria-pressed="false">Top performers</button>
                        </div>
                    </div>
                    <div class="field field-select">
                        <label class="field-label" for="country-filter">Country</label>
                        <div class="select-wrap">
                            <select id="country-filter" class="select">
                                <option value="">All countries</option>
                            </select>
                        </div>
                    </div>
                    <div class="field field-select">
                        <label class="field-label" for="sort">Sort by</label>
                        <div class="select-wrap">
                            <select id="sort" class="select">
                                <option value="activity">Most active</option>
                                <option value="name">Name, A–Z</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <h2 class="visually-hidden">Projects</h2>
            <div class="members-grid" id="members-grid">
                <p class="loading">Loading projects…</p>
            </div>
        </div>
    </main>

    <!-- Footer (loaded from includes/footer.html) -->
    <div id="site-footer"></div>
    <script>
        let allMembers = [];
        let allStats = {};
        let currentFilter = 'all';
        let currentCountry = '';
        let currentSort = 'activity';
        let searchQuery = '';

        // Load members data and stats
        Promise.all([
            fetch('members.json').then(res => res.json()),
            fetch('stats-epoch4.json').then(res => res.json()),
            fetch('stats-historical.json').then(res => res.json()),
            fetch('stats-epoch5.json').then(res => res.json()),
            // Live epoch (currently Epoch 6), from the VPS with this repo as
            // fallback. Tolerate failure of BOTH so the directory still renders
            // from the frozen archives if live data is unavailable entirely.
            fetchLiveData('stats.json').catch(() => null)
        ])
            .then(([membersData, epoch4Data, historicalData, epoch5Data, liveData]) => {
                allMembers = membersData.members;
                allStats = {
                    epoch4: epoch4Data,
                    historical: historicalData,
                    epoch5: epoch5Data,
                    live: liveData
                };

                // Update footer timestamp (prefer the live epoch, fall back through the archives)
                const statsForTimestamp = liveData || epoch5Data || epoch4Data;
                if (statsForTimestamp && statsForTimestamp.generated_at) {
                    const updatedElement = document.getElementById('updated');
                    if (updatedElement) {
                        updatedElement.textContent = new Date(statsForTimestamp.generated_at).toLocaleString('en-GB', { timeZone: 'UTC' }) + ' UTC';
                    }
                }

                initializeFilters();
                applyURLFilters();
                updateStats();
                renderMembers();
            })
            .catch(err => {
                console.error('Error loading members:', err);
                document.getElementById('members-grid').innerHTML = `
                    <div class="empty-state" role="alert">
                        <h3>The directory did not load</h3>
                        <p>Refresh the page to try again.</p>
                        <p class="err-detail">${escapeHtml(err.message)}</p>
                    </div>
                `;
            });

        function initializeFilters() {
            // Populate country filter
            const countries = [...new Set(allMembers.map(m => m.flag + ' ' + m.name_with_flag.match(/\(([^)]+)\)/)?.[1] || '').filter(Boolean))];
            const countrySelect = document.getElementById('country-filter');
            countries.sort().forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                countrySelect.appendChild(option);
            });
        }

        function applyURLFilters() {
            // Check for URL parameters and apply filters
            const urlParams = new URLSearchParams(window.location.search);
            const countryParam = urlParams.get('country');
            const filterParam = urlParams.get('filter');

            if (countryParam) {
                currentCountry = countryParam;
                const countrySelect = document.getElementById('country-filter');
                countrySelect.value = countryParam;
                countrySelect.classList.add('active');
            }

            if (filterParam) {
                currentFilter = filterParam;
                // Update button states
                document.querySelectorAll('[data-filter]').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.filter === filterParam) {
                        btn.classList.add('active');
                    }
                    btn.setAttribute('aria-pressed', btn.classList.contains('active'));
                });
            }
        }

        function getCurrentEpochPostCount(member) {
            // Count posts only from the live epoch (currently Epoch 6)
            const statsName = `${member.name} ${member.flag || ''}`.trim();

            if (allStats.live && allStats.live.top_projects) {
                const liveProject = allStats.live.top_projects.find(p => p.name === statsName);
                if (liveProject && liveProject.posts) {
                    return liveProject.posts.length;
                }
            }

            return 0;
        }

        function getRecentEpochPostCount(member) {
            // Count posts from Epoch 4 testing, Epoch 4, Epoch 5 and the live epoch
            const statsName = `${member.name} ${member.flag || ''}`.trim();
            let totalPosts = 0;

            // Get live epoch posts (currently Epoch 6)
            if (allStats.live && allStats.live.top_projects) {
                const liveProject = allStats.live.top_projects.find(p => p.name === statsName);
                if (liveProject && liveProject.posts) {
                    totalPosts += liveProject.posts.length;
                }
            }

            // Get Epoch 4 posts
            if (allStats.epoch4 && allStats.epoch4.top_projects) {
                const epoch4Project = allStats.epoch4.top_projects.find(p => p.name === statsName);
                if (epoch4Project && epoch4Project.posts) {
                    totalPosts += epoch4Project.posts.length;
                }
            }

            // Get Epoch 5 posts
            if (allStats.epoch5 && allStats.epoch5.top_projects) {
                const epoch5Project = allStats.epoch5.top_projects.find(p => p.name === statsName);
                if (epoch5Project && epoch5Project.posts) {
                    totalPosts += epoch5Project.posts.length;
                }
            }

            // Get Epoch 4 testing posts only (exclude epochs 1-3)
            if (allStats.historical && allStats.historical.epochs && allStats.historical.epochs.epoch4_testing) {
                const epoch = allStats.historical.epochs.epoch4_testing;
                if (epoch && epoch.top_projects) {
                    const project = epoch.top_projects.find(p => p.name === statsName);
                    if (project && project.posts && project.posts.length > 0) {
                        totalPosts += project.posts.length;
                    }
                }
            }

            return totalPosts;
        }

        function updateStats() {
            document.getElementById('total-count').textContent = allMembers.length;
            document.getElementById('active-count').textContent = allMembers.filter(m => getRecentEpochPostCount(m) > 0).length;

            const countries = new Set(allMembers.map(m => m.name_with_flag.match(/\(([^)]+)\)/)?.[1]).filter(Boolean));
            document.getElementById('country-count').textContent = countries.size;
        }

        function filterMembers() {
            let filtered = [...allMembers];

            // Apply activity filter
            if (currentFilter === 'active') {
                filtered = filtered.filter(m => getRecentEpochPostCount(m) > 0);
            } else if (currentFilter === 'epoch6') {
                filtered = filtered.filter(m => getCurrentEpochPostCount(m) > 0);
            } else if (currentFilter === 'top') {
                // Show only top 10 projects by all-time post count
                filtered = filtered
                    .filter(m => getTotalPostCount(m) > 0)
                    .sort((a, b) => getTotalPostCount(b) - getTotalPostCount(a))
                    .slice(0, 10);
            }

            // Apply country filter
            if (currentCountry) {
                filtered = filtered.filter(m => {
                    const memberCountry = m.flag + ' ' + (m.name_with_flag.match(/\(([^)]+)\)/)?.[1] || '');
                    return memberCountry === currentCountry;
                });
            }

            // Apply search
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(m =>
                    m.name.toLowerCase().includes(query) ||
                    m.country.toLowerCase().includes(query) ||
                    m.city.toLowerCase().includes(query) ||
                    m.tagline.toLowerCase().includes(query)
                );
            }

            // Apply sort
            if (currentSort === 'activity') {
                filtered.sort((a, b) => getTotalPostCount(b) - getTotalPostCount(a));
            } else if (currentSort === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            return filtered;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getTotalPostCount(member) {
            // Calculate total posts across all epochs for a member
            const statsName = `${member.name} ${member.flag || ''}`.trim();

            // Get Epoch 4 data
            let epoch4Posts = [];
            if (allStats.epoch4 && allStats.epoch4.top_projects) {
                const epoch4Project = allStats.epoch4.top_projects.find(p => p.name === statsName);
                if (epoch4Project && epoch4Project.posts) {
                    epoch4Posts = epoch4Project.posts;
                }
            }

            // Get Epoch 5 data (when available)
            let epoch5Posts = [];
            if (allStats.epoch5 && allStats.epoch5.top_projects) {
                const epoch5Project = allStats.epoch5.top_projects.find(p => p.name === statsName);
                if (epoch5Project && epoch5Project.posts) {
                    epoch5Posts = epoch5Project.posts;
                }
            }

            // Get live epoch data (currently Epoch 6)
            let livePosts = [];
            if (allStats.live && allStats.live.top_projects) {
                const liveProject = allStats.live.top_projects.find(p => p.name === statsName);
                if (liveProject && liveProject.posts) {
                    livePosts = liveProject.posts;
                }
            }

            // Get historical data
            let historicalPosts = [];
            if (allStats.historical && allStats.historical.epochs) {
                const epochs = allStats.historical.epochs;
                ['epoch1', 'epoch2', 'epoch3', 'epoch4_testing'].forEach(epochKey => {
                    const epoch = epochs[epochKey];
                    if (epoch && epoch.top_projects) {
                        const project = epoch.top_projects.find(p => p.name === statsName);
                        if (project && project.posts && project.posts.length > 0) {
                            historicalPosts.push(...project.posts);
                        }
                    }
                });
            }

            return epoch4Posts.length + epoch5Posts.length + livePosts.length + historicalPosts.length;
        }

        function getMemberBadgeEmojis(member) {
            // Calculate all badges for directory cards (emoji only)
            const badges = [];
            const totalPosts = getTotalPostCount(member);
            const statsName = `${member.name} ${member.flag || ''}`.trim();

            // Get Epoch 4 data for badge-specific calculations
            let epoch4Posts = [];
            if (allStats.epoch4 && allStats.epoch4.top_projects) {
                const epoch4Project = allStats.epoch4.top_projects.find(p => p.name === statsName);
                if (epoch4Project && epoch4Project.posts) {
                    epoch4Posts = epoch4Project.posts;
                }
            }

            // Get Epoch 5 data (when available)
            let epoch5Posts = [];
            if (allStats.epoch5 && allStats.epoch5.top_projects) {
                const epoch5Project = allStats.epoch5.top_projects.find(p => p.name === statsName);
                if (epoch5Project && epoch5Project.posts) {
                    epoch5Posts = epoch5Project.posts;
                }
            }

            // Get live epoch data (currently Epoch 6)
            let livePosts = [];
            if (allStats.live && allStats.live.top_projects) {
                const liveProject = allStats.live.top_projects.find(p => p.name === statsName);
                if (liveProject && liveProject.posts) {
                    livePosts = liveProject.posts;
                }
            }

            // Get historical data
            let historicalPosts = [];
            let epochNames = new Set();
            if (allStats.historical && allStats.historical.epochs) {
                const epochs = allStats.historical.epochs;
                ['epoch1', 'epoch2', 'epoch3', 'epoch4_testing'].forEach(epochKey => {
                    const epoch = epochs[epochKey];
                    if (epoch && epoch.top_projects) {
                        const project = epoch.top_projects.find(p => p.name === statsName);
                        if (project && project.posts && project.posts.length > 0) {
                            historicalPosts.push(...project.posts);
                            epochNames.add(epoch.name);
                        }
                    }
                });
            }

            // Excellence badges (highest priority) - based on best ranking across Epoch 4 and 5
            const epoch4Ranking = allStats.epoch4?.top_projects?.findIndex(p => p.name === statsName) ?? -1;
            const epoch5Ranking = allStats.epoch5?.top_projects?.findIndex(p => p.name === statsName) ?? -1;
            const bestRanking = epoch4Ranking >= 0 && epoch5Ranking >= 0
                ? Math.min(epoch4Ranking, epoch5Ranking)
                : epoch4Ranking >= 0 ? epoch4Ranking : epoch5Ranking;

            if (bestRanking === 0) badges.push('🥇');
            else if (bestRanking === 1) badges.push('🥈');
            else if (bestRanking === 2) badges.push('🥉');
            else if (bestRanking >= 0 && bestRanking < 10) badges.push('🏅');

            // Activity milestones
            if (totalPosts >= 500) {
                badges.push('💎');
            } else if (totalPosts >= 100) {
                badges.push('⭐');
            } else if (totalPosts >= 50) {
                badges.push('🚀');
            } else if (totalPosts >= 10) {
                badges.push('🌱');
            } else if (totalPosts >= 1) {
                badges.push('👋');
            }

            // Community impact - all tiers (across Epoch 4 and 5)
            const powbotPosts = [...epoch4Posts, ...epoch5Posts, ...livePosts];
            if (powbotPosts.length > 0) {
                const uniqueMerchants = new Set(powbotPosts.map(p => p.merchant)).size;
                if (uniqueMerchants >= 25) {
                    badges.push('🌍');
                } else if (uniqueMerchants >= 15) {
                    badges.push('🏪');
                } else if (uniqueMerchants >= 5) {
                    badges.push('🤝');
                }
            }

            // Platform diversity (across Epoch 4 and 5)
            if (powbotPosts.length > 0) {
                const hasXPosts = powbotPosts.some(p => {
                    const url = p.url ? p.url.toLowerCase() : '';
                    return url.includes('twitter.com') || url.includes('x.com');
                });
                const hasNostrPosts = powbotPosts.some(p => {
                    const url = p.url ? p.url.toLowerCase() : '';
                    return url.includes('primal.net') || url.includes('njump') || (!url.includes('twitter.com') && !url.includes('x.com'));
                });
                if (hasXPosts && hasNostrPosts) {
                    badges.push('🎯');
                }
            }

            // Daily streaks - best streak across Epoch 4 and 5
            const calculateStreak = (posts) => {
                if (posts.length === 0) return 0;
                const dates = posts.map(p => p.date.split('T')[0]).sort();
                const uniqueDates = [...new Set(dates)];
                let maxStreak = 1;
                let currentStreak = 1;

                for (let i = 1; i < uniqueDates.length; i++) {
                    const prevDate = new Date(uniqueDates[i - 1]);
                    const currDate = new Date(uniqueDates[i]);
                    const dayDiff = Math.floor((currDate - prevDate) / (1000 * 60 * 60 * 24));
                    if (dayDiff === 1) {
                        currentStreak++;
                        maxStreak = Math.max(maxStreak, currentStreak);
                    } else {
                        currentStreak = 1;
                    }
                }
                return maxStreak;
            };

            const epoch4Streak = calculateStreak(epoch4Posts);
            const epoch5Streak = calculateStreak(epoch5Posts);
            const bestStreak = Math.max(epoch4Streak, epoch5Streak);

            if (bestStreak >= 21) {
                badges.push('💪');
            } else if (bestStreak >= 14) {
                badges.push('⚡');
            } else if (bestStreak >= 7) {
                badges.push('🔥');
            }

            // Legacy badges
            if (historicalPosts.length > 0) {
                const historicalEpochs = epochNames.size;

                // Founding Member
                if (epochNames.has('Epoch 1')) {
                    badges.push('👑');
                }

                // Early Adopter
                if (epochNames.has('Epoch 2') || epochNames.has('Epoch 3')) {
                    badges.push('🏆');
                }

                // Beta Tester
                if (epochNames.has('Epoch 4 Testing')) {
                    badges.push('🧪');
                }

                // Multi-Epoch Veteran
                if (historicalEpochs >= 3 || (historicalEpochs > 0 && epoch4Posts.length > 0 && epoch5Posts.length > 0)) {
                    badges.push('🛡️');
                }
            }

            return badges;
        }

        // Accessible names for the badge emojis. Wording follows the badges on profile.html.
        const BADGE_LABELS = {
            '🥇': 'Top performer: ranked first in epoch 4 or 5',
            '🥈': 'Second place in epoch 4 or 5',
            '🥉': 'Third place in epoch 4 or 5',
            '🏅': 'Top 10 in epoch 4 or 5',
            '💎': 'Diamond status: 500 or more posts',
            '⭐': 'Rising star: 100 or more posts',
            '🚀': 'On fire: 50 or more posts',
            '🌱': 'First steps: 10 or more posts',
            '👋': 'First post',
            '🌍': 'Network connector: 25 or more merchants',
            '🏪': 'Merchant champion: 15 or more merchants',
            '🤝': 'Community builder: 5 or more merchants',
            '🎯': 'All-rounder: active on X and Nostr',
            '💪': '21-day posting streak',
            '⚡': '14-day posting streak',
            '🔥': '7-day posting streak',
            '👑': 'Founding member: took part in epoch 1',
            '🏆': 'Early adopter: took part in epoch 2 or 3',
            '🧪': 'Beta tester: helped test PoWBoT',
            '🛡️': 'Multi-epoch veteran'
        };

        function renderMembers() {
            const grid = document.getElementById('members-grid');
            const members = filterMembers();

            if (members.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No projects match</h3>
                        <p>Change the filters or clear the search.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = members.map((member, index) => {
                const videoCount = getTotalPostCount(member);
                const logoUrl = member.logo_url || '';
                const emoji = member.flag || member.name.charAt(0);
                const cardId = `card-${index}`;
                const name = escapeHtml(member.name);
                const country = escapeHtml(member.country || '');
                const place = [member.city, member.country].filter(Boolean).map(escapeHtml).join(', ');

                return `
                    <article class="member-card" id="${cardId}" data-member-id="${member.id}" aria-labelledby="name-${cardId}">
                        <div class="card-inner">
                            <!-- Front of Card -->
                            <div class="card-front" onclick="viewProfile('${member.id}', event)">
                                <div class="card-header">
                                    ${logoUrl ?
                                        `<img src="${logoUrl}" alt="" class="card-logo" width="80" height="80" loading="lazy" decoding="async" onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
                                         <div class="card-logo-placeholder" aria-hidden="true" hidden>${emoji}</div>`
                                        :
                                        `<div class="card-logo-placeholder" aria-hidden="true">${emoji}</div>`
                                    }
                                </div>
                                <div class="card-body">
                                    <div class="card-title">
                                        <div>
                                            <h3 id="name-${cardId}">${name}</h3>
                                            ${place ? `<p class="card-place">${place}</p>` : ''}
                                        </div>
                                        ${flagHtml(member.flag, country, 'flag')}
                                    </div>
                                    <p class="card-tagline">${(() => {
                                        const tagline = member.tagline || 'Bitcoin circular economy project';
                                        const escaped = escapeHtml(tagline);
                                        return escaped.endsWith('.') || escaped.endsWith('!') || escaped.endsWith('?') ? escaped : escaped + '.';
                                    })()}</p>

                                    <div class="card-footer">
                                        <p class="post-count">${videoCount > 0 ? `<b class="num">${videoCount}</b>${videoCount === 1 ? 'post' : 'posts'}` : ''}</p>
                                        <p class="badge-emojis">${(() => {
                                            const badgeEmojis = getMemberBadgeEmojis(member);
                                            if (!badgeEmojis.length) return '';
                                            return `<span class="visually-hidden">Badges: </span>${badgeEmojis.map(emoji => {
                                                const label = BADGE_LABELS[emoji] || 'Badge';
                                                return `<span class="emoji-badge" role="img" aria-label="${label}" title="${label}">${emoji}</span>`;
                                            }).join('')}`;
                                        })()}</p>
                                        <div class="card-actions">
                                            ${member.lightning_address ? `
                                            <button type="button" class="btn btn-donate" onclick="event.stopPropagation(); flipCard('${cardId}')">Donate<span class="visually-hidden"> to ${name}</span></button>
                                            ` : ''}
                                            <a href="profile.html?id=${member.id}" class="btn" onclick="event.stopPropagation();">View profile<span class="visually-hidden"> of ${name}</span></a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Back of Card: the shared donation panel. Inert until the card turns over. -->
                            ${member.lightning_address ? `
                            <div class="card-back" id="back-${cardId}" inert>
                                ${donatePanelHtml({
                                    id: `donate-${cardId}`,
                                    name: member.name,
                                    lightning: member.lightning_address,
                                    onchain: member.onchain_address || '',
                                    level: 3,
                                    back: `<button type="button" class="btn btn-back" onclick="event.stopPropagation(); flipCard('${cardId}')">Back<span class="visually-hidden"> to ${name}</span></button>`
                                })}
                            </div>
                            ` : ''}
                        </div>
                    </article>
                `;
            }).join('');
        }

        // The face not showing is inert: out of the tab order and hidden from
        // screen readers, as it is from sight.
        function flipCard(cardId) {
            const card = document.getElementById(cardId);
            const back = document.getElementById(`back-${cardId}`);
            if (!card || !back) return;
            const toBack = !card.classList.contains('flipped');
            const panel = back.querySelector('.donate');

            if (toBack) donateDrawQr(panel);
            card.classList.toggle('flipped', toBack);
            card.querySelector('.card-front').inert = toBack;
            back.inert = !toBack;

            if (toBack) donateFocus(panel);
            else card.querySelector('.btn-donate')?.focus({ preventScroll: true });
        }

        function viewProfile(memberId, event) {
            // Only navigate if clicking the card itself, not the buttons
            if (event.target.tagName !== 'BUTTON' && event.target.tagName !== 'A') {
                window.location.href = `profile.html?id=${memberId}`;
            }
        }

        // Event listeners
        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-filter]').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                currentFilter = btn.dataset.filter;
                renderMembers();
            });
        });

        document.getElementById('country-filter').addEventListener('change', (e) => {
            currentCountry = e.target.value;
            // Highlight dropdown when a country is selected
            if (currentCountry) {
                e.target.classList.add('active');
            } else {
                e.target.classList.remove('active');
            }
            renderMembers();
        });

        document.getElementById('sort').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderMembers();
        });

        document.getElementById('search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderMembers();
        });
    </script>

    <!-- Shared nav/footer injection -->
    <script src="includes/inject.js"></script>
</body>
</html>
