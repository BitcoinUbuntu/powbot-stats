    <style>
        /* Epoch 5 results layout only. Colours, type and components: css/powbot.css */
        .head-link { margin: var(--s2) 0 0; }
        .head-link a { display: inline-flex; align-items: center; min-height: var(--tap); }
        /* Final standings and Highlights side by side, stacked on phones: built
           like the homepage's standings and merchants, headings level */
        .standings { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "board highlights" "more ."; column-gap: var(--s7); align-items: start; }
        #board { grid-area: board; }
        .standings-more { grid-area: more; }
        /* Highlights: the heading level with Final standings, then a reversed
           box that runs down to the list's last row. With every project shown
           the list outgrows it by far, so it keeps its own height instead. */
        .highlights { grid-area: highlights; align-self: stretch; display: flex; flex-direction: column; }
        .highlights > .reverse { flex: 1; }
        .standings:has(.lb-list.show-all) > .highlights { align-self: start; }
        /* ...with room under the notes, so it stays close to the height it had */
        .standings:has(.lb-list.show-all) > .highlights > .reverse { padding-bottom: var(--s8); }
        .standings .section-head { flex-direction: column; align-items: flex-start; gap: var(--s3); margin-bottom: var(--s3); }
        .standings .section-note { margin: 0 0 var(--s3); font-size: var(--fs-sm); color: var(--muted); min-height: 1.55em; }
        /* Half a column: one figure per row, and one note per line */
        .standings .facts { grid-template-columns: minmax(0, 1fr); }
        .standings .notes { flex-direction: column; }
        .loading { padding: var(--s6) 0; color: var(--muted); }
        .cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s7); }
        .cols .section { border-bottom: 0; padding: 0; }
        .error { padding: var(--s6) 0; }
        .error p:first-child { font: 700 var(--fs-md)/1.4 var(--font-text); color: var(--danger); }

        @media (max-width: 720px) {
            .cols { grid-template-columns: minmax(0, 1fr); }
            /* Phones: the list, its button, then Highlights */
            .standings { grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "more" "highlights"; }
            .highlights { margin-top: var(--s7); }
        }
    </style>
</head>
<body class="pb">
    <!-- Navigation (loaded from includes/nav.html) -->
    <div id="site-nav"></div>

    <main id="main">
        <div class="wrap">
            <header class="page-head">
                <h1>Epoch 5 final results</h1>
                <p class="lede">The final standings of Epoch 5, which ran from 24 March to 3 July 2026.</p>
                <p class="head-link"><a href="index.html">See the current epoch</a></p>
            </header>

            <div id="content" aria-live="polite">
                <p class="loading">Loading the final results…</p>
            </div>
        </div>
    </main>

    <!-- Footer (loaded from includes/footer.html) -->
    <div id="site-footer"></div>

    <!-- Shared nav/footer injection - load first -->
    <script src="includes/inject.js"></script>
    <!-- Finished epochs and the shared "Every epoch" block -->
    <script src="epochs.js"></script>
    <script src="flags.js"></script>

    <script>
        // Global project metadata
        let projectMetadata = {};

        // Rows shown before "Show all".
        const BOARD_ROWS = 10;
        const LIST_ROWS = 8;

        // Posts approved in the epochs before this one. Frozen; epoch 4 includes
        // its testing phase. Same figures the old epochs chart used (2,867 in all).

        // Format numbers with thousands separators
        function formatNumber(num) {
            return Number(num || 0).toLocaleString('en-GB');
        }

        // "2026-07-03" -> "3 Jul", always UTC
        function formatDay(dateStr) {
            const d = new Date(String(dateStr).length === 10 ? dateStr + 'T00:00:00Z' : dateStr);
            if (isNaN(d)) return '';
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // For use inside a quoted HTML attribute
        function attrSafe(text) {
            return escapeHtml(String(text ?? ''))
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const FLAG_RE = /[\u{1F1E6}-\u{1F1FF}]{2}/u;
        const stripFlags = (name) => String(name || '').replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu, '').trim();
        const flagOf = (name) => (String(name || '').match(FLAG_RE) || [''])[0];
        const plural = (n, one, many) => `${formatNumber(n)} ${n === 1 ? one : many}`;

        // "Bitcoin Ekasi 🇿🇦" -> "bitcoin-ekasi"
        function profileId(name) {
            return String(name || '')
                .replace(/[^\w\s-]/g, '') // Remove emojis and special characters
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '-'); // Replace spaces with hyphens
        }

        function profileUrl(name, type = 'project') {
            return `${type === 'merchant' ? 'merchant-profile.html' : 'profile.html'}?id=${profileId(name)}`;
        }

        // Epoch 5's approved posts in the tracker, for one country or merchant
        function trackerUrl(filters) {
            return `tracker.html?${new URLSearchParams({ epoch: '5', ...filters, status: 'Processed' })}`;
        }

        // ------------------------------------------------------ Highlights --

        // The epoch's figures and notes, beside the final standings
        function renderHighlights(stats) {
            const reviewed = stats.reviewer?.total_reviewed || 0;
            const rate = reviewed > 0 ? Math.round((stats.reviewer.approved / reviewed) * 100) + '%' : '–';
            const facts = [
                [formatNumber(stats.reviewer?.approved || 0), 'posts approved'],
                [formatNumber(stats.top_projects?.length || 0), 'projects'],
                [formatNumber(stats.top_merchants?.length || 0), 'merchants'],
                [formatNumber(stats.countries?.length || 0), 'countries'],
                [rate, 'approval rate']
            ];
            if (stats.launch?.days_active > 0) facts.push([formatNumber(stats.launch.days_active), 'days']);

            // What used to rotate through the Highlights card, kept as plain notes.
            const notes = [];
            if (reviewed > 0) {
                notes.push(`<strong>${formatNumber(reviewed)}</strong> posts reviewed, ${formatNumber(stats.reviewer?.rejected || 0)} rejected`);
            }
            if (stats.platforms && stats.platforms.length > 0) {
                const totalPlatforms = stats.platforms.reduce((sum, p) => sum + p.count, 0);
                if (totalPlatforms > 0) {
                    notes.push(`Posted on ${stats.platforms.map(p => `<strong>${escapeHtml(p.platform)} ${Math.round((p.count / totalPlatforms) * 100)}%</strong>`).join(', ')}`);
                }
            }
            // Record day: most posts approved in one UTC day, as on the homepage
            if (stats.daily && stats.daily.length > 0) {
                const recordDay = stats.daily.reduce((max, day) =>
                    ((day.approved || 0) > (max?.approved || 0)) ? day : max, null);
                if (recordDay && recordDay.approved > 0) {
                    notes.push(`Most approved in a day: <strong>${formatNumber(recordDay.approved)}</strong>, on ${formatDay(recordDay.date)}`);
                }
            }
            if (stats.launch?.days_active > 0 && stats.reviewer?.approved > 0) {
                notes.push(`<strong>${Math.round(stats.reviewer.approved / stats.launch.days_active)}</strong> posts a day on average`);
            }
            // Newest project: the one whose first post is most recent
            if (stats.top_projects && stats.top_projects.length > 0) {
                let newestProject = null;
                let newestFirstDate = null;
                stats.top_projects.forEach(project => {
                    if (project.posts && project.posts.length > 0) {
                        const firstDate = project.posts.map(p => p.date).sort()[0];
                        if (!newestFirstDate || firstDate > newestFirstDate) {
                            newestFirstDate = firstDate;
                            newestProject = project;
                        }
                    }
                });
                if (newestProject && newestProject !== stats.top_projects[0]) {
                    notes.push(`Newest project: <strong>${escapeHtml(stripFlags(newestProject.name))}</strong>, first post ${formatDay(newestFirstDate)}`);
                }
            }
            // Country firsts (countries with only 1 project)
            (stats.countries || []).filter(c => c.count === 1).forEach(c => {
                notes.push(`First from <strong>${escapeHtml(c.country)}</strong> ${flagHtml(c.flag)}`);
            });
            // Top Lightning provider (a count of addresses, never amounts)
            if (stats.lightning_providers && stats.lightning_providers.length > 0) {
                notes.push(`Top Lightning provider: <strong>${escapeHtml(stats.lightning_providers[0].domain)}</strong>`);
            }
            return `
                <section class="highlights" aria-labelledby="highlights-title">
                    <div class="section-head"><h2 id="highlights-title">Highlights</h2></div>
                    <div class="reverse">
                        <ul class="facts">${facts.map(([n, l]) => `<li><b class="num">${n}</b><span>${l}</span></li>`).join('')}</ul>
                        ${notes.length ? `<ul class="notes">${notes.map(n => `<li>${n}</li>`).join('')}</ul>` : ''}
                    </div>
                </section>`;
        }

        // ----------------------------------------------------- Standings --

        // Final standings: "Merchants" (default) ranks projects by different
        // merchants with an approved post; "Posts" is the order in the file.
        let standingsStats = null;
        let standingsView = 'merchants';

        function standingsRows(stats) {
            return (stats.top_projects || []).map((item, order) => {
                const posts = item.posts || [];
                const firstAt = {};
                posts.forEach(x => {
                    if (!x.merchant) return;
                    if (!firstAt[x.merchant] || x.date < firstAt[x.merchant]) firstAt[x.merchant] = x.date;
                });
                const firsts = Object.values(firstAt).sort();
                return { item, posts, order, count: item.count ?? posts.length, merchants: firsts.length, reachedAt: firsts[firsts.length - 1] || '' };
            });
        }

        // The ranked list, as on the homepage: one row per project, each opening
        // its profile (which holds every epoch's posts)
        function standingsList(stats, by) {
            const countryByFlag = {};
            (stats.countries || []).forEach(c => { countryByFlag[c.flag] = c.country; });

            const ranked = standingsRows(stats);
            if (by === 'merchants') {
                // Most merchants first; level projects by posts, then by who got there first
                ranked.sort((a, b) => b.merchants - a.merchants || b.count - a.count
                    || a.reachedAt.localeCompare(b.reachedAt) || a.order - b.order);
            }

            const items = ranked.map(({ item, count, merchants }, i) => {
                const flag = flagOf(item.name);
                return `
                    <li class="${i >= BOARD_ROWS ? 'is-more' : ''}"><a href="${attrSafe(profileUrl(item.name, 'project'))}">
                        <span class="li-main"><span class="lb-rank num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span><span class="lb-name">${nameWithFlag(stripFlags(item.name), flag, countryByFlag[flag] || '')}</span></span>
                        <span class="li-side num">${by === 'merchants' ? plural(merchants, 'merchant', 'merchants') : plural(count, 'post', 'posts')}</span>
                    </a></li>`;
            }).join('');
            const caption = `Epoch 5 projects ranked by ${by === 'merchants' ? 'the number of different merchants with an approved post' : 'approved posts'}`;
            return `
                <p class="section-note">${by === 'merchants' ? 'Different merchants with an approved post in Epoch 5.' : 'Posts approved in Epoch 5.'}</p>
                <ol class="list lb-list" id="lb-list" aria-label="${attrSafe(caption)}">${items}</ol>`;
        }

        // "Show all" sits in its own row of the layout, under the list, so the
        // Highlights box beside the list can end level with its last row
        function standingsMore(stats) {
            const total = (stats.top_projects || []).length;
            const label = `Show all ${total} projects`;
            return total > BOARD_ROWS ? `<button type="button" class="btn list-more" data-list="lb-list" data-label="${label}" aria-controls="lb-list" aria-expanded="false">${label}</button>` : '';
        }

        function renderStandings(stats) {
            const projects = stats.top_projects || [];
            if (projects.length === 0) {
                return `
                    <section aria-labelledby="board-title" id="board">
                        <h2 id="board-title">Final standings</h2>
                        <p>No approved posts were recorded for Epoch 5.</p>
                    </section>`;
            }
            standingsStats = stats;

            return `
                <section aria-labelledby="board-title" id="board">
                    <div class="section-head">
                        <h2 id="board-title">Final standings</h2>
                        <div class="seg" role="group" aria-label="Rank projects by" id="standings-view">
                            <button type="button" data-view="merchants" aria-pressed="${standingsView === 'merchants'}">Merchants</button>
                            <button type="button" data-view="posts" aria-pressed="${standingsView === 'posts'}">Posts</button>
                        </div>
                    </div>
                    <div id="standings-body" aria-live="polite">${standingsList(stats, standingsView)}</div>
                </section>
                <div class="standings-more" id="standings-more">${standingsMore(stats)}</div>`;
        }

        // ------------------------------------------ Merchants and countries --

        function renderMerchantsAndCountries(stats) {
            const merchants = stats.top_merchants || [];
            const countries = stats.countries || [];

            // Each opens its posts in the tracker, filtered to that merchant exactly
            const merchantItems = merchants.map((m, i) => `
                <li class="${i >= LIST_ROWS ? 'is-more' : ''}"><a href="${attrSafe(trackerUrl({ merchant: m.name }))}">
                    <span class="li-main">${escapeHtml(m.name)}</span>
                    <span class="li-side num">${plural(m.count, 'post', 'posts')}</span>
                </a></li>`).join('');

            // In the Epoch 5 file a country's count is its approved posts, the
            // same as the tracker's processed posts for it, where each row opens.
            const countryItems = countries.map(c => `
                <li><a href="${attrSafe(trackerUrl({ country: c.country }))}">
                    <span class="li-main">${flagHtml(c.flag)} ${escapeHtml(c.country)}</span>
                    <span class="li-side num">${plural(c.count, 'post', 'posts')}</span>
                </a></li>`).join('');

            return `
                <div class="section"><div class="cols">
                    <section class="section" aria-labelledby="merchants-title">
                        <h2 id="merchants-title">Merchants with the most posts</h2>
                        <p class="section-note">Shops and stalls where projects spent bitcoin. Open one to see its Epoch&nbsp;5 posts in the tracker.</p>
                        ${merchants.length
                            ? `<ul class="list" id="merchant-list">${merchantItems}</ul>
                               ${merchants.length > LIST_ROWS ? `<p class="list-link"><a class="btn" href="merchants.html?epoch=5">All ${formatNumber(merchants.length)} merchants in the directory</a></p>` : ''}`
                            : '<p>No merchants were recorded for Epoch 5.</p>'}
                    </section>
                    <section class="section" aria-labelledby="countries-title">
                        <h2 id="countries-title">Countries</h2>
                        <p class="section-note">Where Epoch&nbsp;5’s projects posted from. Open one to see its posts in the tracker.</p>
                        ${countries.length ? `<ul class="list">${countryItems}</ul>` : '<p>No countries were recorded for Epoch 5.</p>'}
                    </section>
                </div></div>`;
        }

        // ------------------------------------------------ Posts per day --

        function renderDaily(stats) {
            const daily = stats.daily || [];

            // Show the full epoch as a continuous daily timeline, trimmed at the last day with activity
            let end = daily.length;
            while (end > 0 && !((daily[end - 1].approved || 0) > 0 || (daily[end - 1].rejected || 0) > 0)) end--;
            const displayData = daily.slice(0, end);

            if (displayData.length === 0) {
                return `
                    <section class="section" aria-labelledby="daily-title">
                        <h2 id="daily-title">Approved posts per day</h2>
                        <p>No daily figures were recorded for Epoch 5.</p>
                    </section>`;
            }

            const max = Math.max(1, ...displayData.map(d => d.approved || 0));
            const peak = displayData.find(d => (d.approved || 0) === max);
            const label = d => `${formatDay(d.date)}: ${plural(d.approved || 0, 'post', 'posts')} approved`;
            const bars = displayData.map(d => `<i style="height:${(d.approved || 0) / max * 100}%" data-label="${attrSafe(label(d))}"></i>`).join('');
            const first = displayData[0];
            const last = displayData[displayData.length - 1];

            return `
                <section class="section" aria-labelledby="daily-title">
                    <h2 id="daily-title">Approved posts per day</h2>
                    <p class="section-note">One bar per UTC day, ${formatDay(first.date)} to ${formatDay(last.date)} 2026. Hover, tap or use the arrow keys to read a day.</p>
                    <p class="bars-readout" aria-live="polite">Busiest day, ${escapeHtml(label(peak))}</p>
                    <div class="bars" tabindex="0" role="group" aria-label="Approved posts per day over ${displayData.length} days, ${formatDay(first.date)} to ${formatDay(last.date)}. Peak ${max} on ${formatDay(peak?.date)}. Use the left and right arrow keys to read each day.">
                        ${bars}
                    </div>
                    <div class="bars-axis" aria-hidden="true"><span>${formatDay(first.date)}</span><span>${formatDay(last.date)}</span></div>
                </section>`;
        }

        // ----------------------------------------------- Every epoch --

        function renderEpochs(stats) {
            // Frozen totals come from epochs.js; Epoch 5 is this page. The bars
            // only: each epoch's rules note lives in the archive's copy.
            return window.renderEpochBars({
                id: 'epochs-title',
                intro: `<strong class="num">${formatNumber(window.epochsTotal())}</strong> posts approved from May 2025 to the end of Epoch 5. Epoch 6 is on the <a href="index.html">live leaderboard</a>.`,
                more: '<a href="archive.html#every-title">See how the rules changed</a>.',
                notes: false,
                current: 'Epoch 5'
            });
        }

        // The standings switch, and "Show all" on the standings and the lists
        document.getElementById('content').addEventListener('click', (e) => {
            const view = e.target.closest('#standings-view button');
            if (view) {
                if (view.dataset.view !== standingsView && standingsStats) {
                    standingsView = view.dataset.view;
                    document.querySelectorAll('#standings-view button').forEach(b => b.setAttribute('aria-pressed', String(b === view)));
                    document.getElementById('standings-body').innerHTML = standingsList(standingsStats, standingsView);
                    document.getElementById('standings-more').innerHTML = standingsMore(standingsStats);
                }
                return;
            }
            const btn = e.target.closest('.list-more');
            if (btn) {
                const list = document.getElementById(btn.dataset.list);
                const open = !list.classList.contains('show-all');
                list.classList.toggle('show-all', open);
                btn.setAttribute('aria-expanded', String(open));
                btn.textContent = open ? 'Show fewer' : btn.dataset.label;
            }
        });

        // Render the dashboard
        function renderDashboard(stats) {
            // Update timestamp (may not exist yet if footer is still loading)
            const updatedElement = document.getElementById('updated');
            if (updatedElement) {
                updatedElement.textContent = new Date(stats.generated_at).toLocaleString('en-GB', { timeZone: 'UTC' }) + ' UTC';
            }

            document.getElementById('content').innerHTML =
                `<div class="section standings">${renderStandings(stats)}${renderHighlights(stats)}</div>` +
                renderMerchantsAndCountries(stats) +
                renderDaily(stats) +
                renderEpochs(stats);
        }

        // Load and render stats
        async function loadStats() {
            try {
                // Frozen Epoch 5 snapshot - never reads the live stats.json
                const [statsResponse, membersResponse] = await Promise.all([
                    fetch('stats-epoch5.json?t=' + Date.now()),
                    fetch('members.json?t=' + Date.now()).catch(() => null)
                ]);

                if (!statsResponse.ok) {
                    throw new Error(`HTTP ${statsResponse.status}`);
                }
                const stats = await statsResponse.json();

                // Build project metadata from members.json
                if (membersResponse && membersResponse.ok) {
                    const membersData = await membersResponse.json();
                    // Build lookup map: project name with flag → profile URL
                    membersData.members.forEach(member => {
                        // Index by both formats for compatibility
                        const shortKey = `${member.name} ${member.flag}`;  // "Bitbiashara 🇰🇪"
                        const longKey = member.name_with_flag;  // "Bitbiashara (Kenya) 🇰🇪"
                        const metadata = {
                            info_url: `profile.html?id=${member.id}`
                        };
                        projectMetadata[shortKey] = metadata;
                        projectMetadata[longKey] = metadata;
                    });
                }

                renderDashboard(stats);
            } catch (error) {
                console.error('Failed to load stats:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <p>The Epoch 5 results could not load.</p>
                        <p>Reload the page, or try again in a few minutes.</p>
                        <p class="muted mono">${escapeHtml(error.message)}</p>
                    </div>
                `;
            }
        }

        // Initialize - wait for includes to load first
        window.includesLoaded.then(() => loadStats());
    </script>
