<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://powbot.africa/archive.html">
    <title>PoWBoT archive – past epochs</title>
    <meta name="description" content="Final PoWBoT leaderboards from past epochs: approved proof-of-work posts by project and merchant, from Epoch 1 in May 2025 to Epoch 4.">
    <meta name="theme-color" content="#37442F">
    <script>
        // Light, if chosen with the header switch (dark is the default), and
        // screen effects if turned off (both kept by includes/inject.js):
        // applied before the page first paints, so it never flashes
        (function () {
            try {
                if (localStorage.getItem('pb-theme') === 'light') document.documentElement.dataset.theme = 'light';
                if (localStorage.getItem('pb-screen-effects') === 'off') document.documentElement.classList.add('fx-off');
            } catch (e) { /* storage blocked: the defaults, dark with effects on */ }
        })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="images/stats_emoji_32px.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/stats_emoji_16px.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/stats_emoji_180px.png">

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://powbot.africa/archive.html">
    <meta property="og:title" content="PoWBoT Stats - Historical Archive">
    <meta property="og:description" content="Complete historical stats archive for all PoWBoT epochs.">
    <meta property="og:image" content="https://powbot.africa/images/PoWBoT_preview.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://powbot.africa/archive.html">
    <meta name="twitter:title" content="PoWBoT Stats - Historical Archive">
    <meta name="twitter:description" content="Complete historical stats archive for all PoWBoT epochs.">
    <meta name="twitter:image" content="https://powbot.africa/images/PoWBoT_preview.jpg">

    <link rel="preload" href="fonts/vt323-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/atkinson-hyperlegible-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/powbot.css">
    <style>
        /* Archive layout only. Colours, type and components: css/powbot.css */
        .loading { padding: var(--s7) 0; color: var(--muted); }
        .error { padding: var(--s7) 0; max-width: 60ch; }
        .error p { margin: 0 0 var(--s3); }
        .error p:first-child { font: 700 var(--fs-md)/1.4 var(--font-text); color: var(--danger); }

        .section > .facts { margin-top: var(--s5); }

        /* Panels inside an epoch: two side by side, a wide one on its own row */
        .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s7); margin-top: var(--s7); }
        .panel-wide { margin-top: var(--s7); }
        .epoch-more { margin: var(--s6) 0 0; }
        .panel { min-width: 0; }
        .panel > h3 { margin: 0 0 var(--s2); font-size: 1.5rem; }
        .panel > .section-note { margin-bottom: var(--s4); }

        /* Rankings sit in half a column, so names wrap rather than push the table wide */
        .lb .proj-name { overflow-wrap: anywhere; }
        .lb .row-toggle { width: 100%; }
        /* Inline, so a wrapped name keeps its chevron beside the last word */
        .lb .row-toggle .row-line { display: inline; }
        .lb .row-toggle .chev { display: inline-block; margin-left: 6px; vertical-align: 0.15em; }
        .lb-more { margin-top: var(--s4); }
        .board-empty { padding: var(--s5); margin: 0; }

        @media (max-width: 720px) {
            .cols { grid-template-columns: minmax(0, 1fr); gap: var(--s7); }
        }
    </style>
</head>
<body class="pb">
    <!-- Navigation (loaded from includes/nav.html) -->
    <div id="site-nav"></div>

    <main id="main">
        <div class="wrap">
            <header class="page-head">
                <h1>PoWBoT archive</h1>
                <p class="lede">Final leaderboards and totals from past epochs.</p>
            </header>

            <div id="content">
                <p class="loading">Loading the archive…</p>
            </div>
        </div>
    </main>

    <!-- Footer (loaded from includes/footer.html) -->
    <div id="site-footer"></div>

    <!-- Shared nav/footer injection - load first -->
    <script src="includes/inject.js"></script>
    <!-- Finished epochs and the shared "Every epoch" block -->
    <script src="epochs.js"></script>
    <script src="flags.js"></script>
    <script src="visits.js"></script>

    <script>
        // Global project metadata
        let projectMetadata = {};

        // Rows shown in each ranking before "Show more"
        const INITIAL_ROWS = 5;
        const DETAIL_ROWS = 5;   // visits shown in an opened leaderboard row

        // Epoch 5 has its own page (epoch5.html). Its total is frozen, the same
        // figure the homepage uses.

        // Format numbers with thousands separators
        function formatNumber(num) {
            return Number(num || 0).toLocaleString('en-GB');
        }

        // "2026-01-15" -> "15 Jan 2026", always UTC
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(String(dateStr).length === 10 ? dateStr + 'T00:00:00Z' : dateStr);
            if (isNaN(date)) return '';
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
        }

        // "2026-01-15" -> "15 Jan", always UTC
        function formatDay(dateStr) {
            const date = new Date(String(dateStr).length === 10 ? dateStr + 'T00:00:00Z' : dateStr);
            if (isNaN(date)) return '';
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // For use inside a quoted HTML attribute
        function attrSafe(text) {
            return escapeHtml(String(text ?? ''))
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const FLAG_RE = /[\u{1F1E6}-\u{1F1FF}]{2}/u;
        const stripFlags = (name) => String(name || '').replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu, '').trim();
        const flagOf = (name) => (String(name || '').match(FLAG_RE) || [''])[0];

        const plural = (n, one, many) => `${formatNumber(n)} ${n === 1 ? one : many}`;

        function renderViewProfileButton(name, type = 'project') {
            // Convert name to profile ID (e.g., "Bitcoin Ekasi 🇿🇦" -> "bitcoin-ekasi")
            const profileId = name
                .replace(/[^\w\s-]/g, '') // Remove emojis and special characters
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '-'); // Replace spaces with hyphens

            const profileUrl = type === 'merchant' ? 'merchant-profile.html' : 'profile.html';

            const shown = stripFlags(name);
            return `<a class="btn" href="${profileUrl}?id=${profileId}">View ${escapeHtml(shown)}${/s$/i.test(shown) ? '’' : '’s'} profile</a>`;
        }

        function renderViewAllButton(name, type, postCount) {
            // Convert name to profile ID
            const profileId = name
                .replace(/[^\w\s-]/g, '')
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '-');

            const profileUrl = type === 'merchant' ? 'merchant-profile.html' : 'profile.html';

            return `<a class="btn" href="${profileUrl}?id=${profileId}">All ${formatNumber(postCount)} posts on the profile</a>`;
        }

        // ------------------------------------------------------ Page parts --

        function factsHtml(facts) {
            return `<ul class="facts">${facts.map(([n, label]) => `<li><b class="num">${n}</b><span>${label}</span></li>`).join('')}</ul>`;
        }

        function platformNote(platforms) {
            const total = (platforms || []).reduce((s, p) => s + p.count, 0);
            if (total === 0) return '';
            if (platforms.length === 1) return `All posts were on <strong>${escapeHtml(platforms[0].platform)}</strong>`;
            return `Posted on ${platforms.map(p => `<strong>${escapeHtml(p.platform)} ${Math.round(p.count / total * 100)}%</strong>`).join(', ')}`;
        }

        function notesHtml(notes) {
            const items = notes.filter(Boolean);
            return items.length ? `<ul class="notes">${items.map(n => `<li>${n}</li>`).join('')}</ul>` : '';
        }

        // Panels: consecutive normal panels pair up in two columns; a wide one gets its own row
        function panelsHtml(panels) {
            let html = '';
            let pair = [];
            const panel = p => `
                <div class="panel">
                    <h3 id="${p.id}-title">${p.title}</h3>
                    ${p.note ? `<p class="section-note">${p.note}</p>` : ''}
                    ${p.html}
                </div>`;
            const flush = () => { if (pair.length) html += `<div class="cols">${pair.map(panel).join('')}</div>`; pair = []; };
            panels.forEach(p => {
                if (p.wide) { flush(); html += `<div class="panel-wide">${panel(p)}</div>`; }
                else { pair.push(p); if (pair.length === 2) flush(); }
            });
            flush();
            return html;
        }

        function epochSectionHtml(e) {
            return `
                <section class="section" id="${e.id}" aria-labelledby="${e.id}-title">
                    <h2 id="${e.id}-title">${e.title}</h2>
                    <p class="section-note">${e.note}</p>
                    ${factsHtml(e.facts)}
                    ${notesHtml(e.notes || [])}
                    ${panelsHtml(e.panels || [])}
                    ${e.after || ''}
                </section>`;
        }

        function countriesHtml(countries, linked) {
            if (!countries || countries.length === 0) return '<p>No countries recorded for this epoch.</p>';
            return `<ul class="list">${countries.map(c => {
                const inner = `<span class="li-main">${flagHtml(c.flag)} ${escapeHtml(c.country)}</span>
                    <span class="li-side num">${plural(c.count, 'project', 'projects')}</span>`;
                return linked
                    ? `<li><a href="members.html?filter=active&amp;country=${encodeURIComponent(c.flag + ' ' + c.country)}">${inner}</a></li>`
                    : `<li><div class="row">${inner}</div></li>`;
            }).join('')}</ul>`;
        }

        // Approved posts per day. Days with no payments of any kind are left out.
        function renderDaily(daily) {
            // Filter to only show days with activity
            const activeData = (daily || []).filter(d => d.project_count > 0 || d.merchant_count > 0 || d.reviewer_count > 0);
            const displayData = activeData.length > 0 ? activeData : (daily || []).slice(-7);
            if (displayData.length === 0) return '<p>No daily records for this epoch.</p>';

            const max = Math.max(1, ...displayData.map(d => d.project_count || 0));
            const peak = displayData.find(d => (d.project_count || 0) === max);
            const label = d => `${formatDay(d.date)}: ${formatNumber(d.project_count || 0)} ${(d.project_count || 0) === 1 ? 'post' : 'posts'} approved`;
            const bars = displayData.map(d => `<i style="height:${(d.project_count || 0) / max * 100}%" data-label="${label(d)}"></i>`).join('');
            const first = displayData[0].date;
            const last = displayData[displayData.length - 1].date;

            return `
                <p class="bars-readout" aria-live="polite">Busiest day, ${label(peak)}</p>
                <div class="bars" tabindex="0" role="group" aria-label="Approved posts per day over ${displayData.length} days, ${formatDay(first)} to ${formatDate(last)}. Peak ${max} on ${formatDate(peak?.date)}. Use the left and right arrow keys to read each day.">
                    ${bars}
                </div>
                <div class="bars-axis" aria-hidden="true"><span>${formatDay(first)}</span><span>${formatDay(last)}</span></div>`;
        }

        function renderEveryEpoch() {
            // Frozen totals and notes come from epochs.js (shared with the homepage
            // and the Epoch 5 page)
            return window.renderEpochBars({
                id: 'every-title',
                title: 'Every epoch',
                intro: `<strong class="num">${formatNumber(window.epochsTotal())}</strong> posts approved across five epochs, May 2025 to July 2026.`
            });
        }

        // Render the dashboard
        function renderDashboard(epoch4Live, historical) {
            const content = document.getElementById('content');
            const updatedElement = document.getElementById('updated');
            if (updatedElement) {
                updatedElement.textContent = new Date(epoch4Live.generated_at).toLocaleString('en-GB', { timeZone: 'UTC' }) + ' UTC';
            }

            // Epoch 5 has its own page with the full standings. Its numbers are
            // frozen, so they are written here rather than loading its 780 KB
            // stats file for six figures (from stats-epoch5.json, as that page
            // computes them).
            const epoch5 = {
                id: 'epoch-5',
                title: 'Epoch 5',
                note: '24 March to 3 July 2026.',
                facts: [
                    [formatNumber(1985), 'posts approved'],
                    ['22', 'projects'],
                    ['156', 'merchants'],
                    ['7', 'countries'],
                    ['96%', 'approval rate'],
                    ['103', 'days']
                ],
                notes: [
                    `<strong>${formatNumber(2068)}</strong> posts reviewed, 83 rejected`,
                    'Posted on <strong>X 50%</strong>, <strong>Nostr 50%</strong>',
                    `Most approved in a day: <strong>40</strong>, on ${formatDate('2026-03-27')}`,
                    '<strong>19</strong> posts a day on average'
                ],
                after: '<p class="epoch-more"><a class="btn" href="epoch5.html">See the Epoch 5 final results</a></p>'
            };

            const e4 = epoch4Live;
            const ep = historical.epochs;
            // Posts approved, as on the homepage and the Epoch 5 page (the project payment
            // count is one higher for Epoch 4)
            const e4Approved = e4.reviewer?.approved ?? e4.totals.by_type.project?.count ?? 0;
            const reviewed = e4.reviewer?.total_reviewed || 0;
            const days = e4.launch?.days_active || 0;
            const busiest = (e4.daily || []).reduce((m, d) => (d.project_count > (m?.project_count || 0) ? d : m), null);

            const epoch4 = {
                id: 'epoch-4',
                title: 'Epoch 4',
                note: '13 January to 4 March 2026.',
                facts: [
                    [formatNumber(e4Approved), 'posts approved'],
                    [formatNumber(e4.top_projects?.length || 0), 'projects'],
                    [formatNumber(e4.top_merchants?.length || 0), 'merchants'],
                    [formatNumber(e4.countries?.length || 0), 'countries'],
                    [reviewed > 0 ? Math.round((e4.reviewer.approved / reviewed) * 100) + '%' : '–', 'approval rate'],
                    [formatNumber(days), 'days']
                ],
                notes: [
                    platformNote(e4.platforms),
                    reviewed > 0 ? `Rejected: <strong>${formatNumber(e4.reviewer?.rejected || 0)}</strong> of ${formatNumber(reviewed)} reviewed` : '',
                    days > 0 ? `Daily average: <strong>${formatNumber(Math.round(e4Approved / days))}</strong> approved posts, ${formatNumber(e4.launch.daily_average_payments || 0)} payments` : '',
                    busiest ? `Most approved in a day: <strong>${busiest.project_count}</strong>, on ${formatDate(busiest.date)}` : '',
                    `Payments: <strong>${formatNumber(e4.totals.all_payments)}</strong>, of which ${formatNumber(e4.totals.by_type.project?.count || 0)} to projects, ${formatNumber(e4.totals.by_type.merchant?.count || 0)} to merchants and ${formatNumber(e4.totals.by_type.reviewer?.count || 0)} for reviews`
                ],
                panels: [
                    { id: 'e4-projects', title: 'Projects by approved posts', html: '<div id="top-projects"></div>' },
                    { id: 'e4-merchants', title: 'Merchants by approved posts', html: '<div id="top-merchants"></div>' },
                    { id: 'e4-daily', title: 'Approved posts per day', html: renderDaily(e4.daily), wide: true },
                    { id: 'e4-countries', title: 'Countries', note: 'Open one to see its projects in the directory.', html: countriesHtml(e4.countries, true) }
                ]
            };

            const t = ep.epoch4_testing;
            const testing = {
                id: 'epoch-4-testing',
                title: 'Epoch 4 testing period',
                note: 'December 2025, before Epoch 4 opened.',
                facts: [
                    [formatNumber(t.total_posts), 'posts approved'],
                    [formatNumber(t.top_projects?.length || 0), 'projects'],
                    [formatNumber(t.top_merchants?.length || 0), 'merchants'],
                    [formatNumber(t.countries?.length || 0), 'countries']
                ],
                notes: [platformNote(t.platforms)],
                panels: [
                    { id: 'e4t-projects', title: 'Projects by approved posts', html: '<div id="epoch4-testing-projects"></div>' },
                    { id: 'e4t-merchants', title: 'Merchants by approved posts', html: '<div id="epoch4-testing-merchants"></div>' },
                    { id: 'e4t-countries', title: 'Countries', html: countriesHtml(t.countries, false) }
                ]
            };

            const early = (key, number, when) => {
                const e = ep[key];
                return {
                    id: `epoch-${number}`,
                    title: `Epoch ${number}`,
                    note: `${when}, before PoWBoT.`,
                    facts: [
                        [formatNumber(e.total_posts), 'posts approved'],
                        [formatNumber(e.top_projects?.length || 0), 'projects'],
                        [formatNumber(e.countries?.length || 0), 'countries']
                    ],
                    notes: [platformNote(e.platforms)],
                    panels: [
                        { id: `e${number}-projects`, title: 'Projects by approved posts', html: `<div id="epoch${number}-projects"></div>` },
                        { id: `e${number}-countries`, title: 'Countries', html: countriesHtml(e.countries, false) }
                    ]
                };
            };

            content.innerHTML =
                renderEveryEpoch(epoch4Live, historical) +
                [epoch5, epoch4, testing, early('epoch3', 3, 'November 2025'), early('epoch2', 2, 'August 2025'), early('epoch1', 1, 'May 2025')]
                    .map(epochSectionHtml).join('');

            // Render leaderboards
            renderLeaderboard('top-projects', epoch4Live.top_projects, 'project', true, INITIAL_ROWS, { countries: e4.countries, caption: 'Epoch 4 projects ranked by approved posts' });
            renderLeaderboard('top-merchants', epoch4Live.top_merchants, 'merchant', true, INITIAL_ROWS, { countries: e4.countries, caption: 'Epoch 4 merchants ranked by approved posts' });
            renderLeaderboard('epoch4-testing-projects', t.top_projects, 'project', true, INITIAL_ROWS, { countries: t.countries, caption: 'Epoch 4 testing period projects ranked by approved posts' });
            renderLeaderboard('epoch4-testing-merchants', t.top_merchants, 'merchant', true, INITIAL_ROWS, { countries: t.countries, caption: 'Epoch 4 testing period merchants ranked by approved posts' });
            renderLeaderboard('epoch3-projects', ep.epoch3.top_projects, 'project', false, INITIAL_ROWS, { countries: ep.epoch3.countries, caption: 'Epoch 3 projects ranked by approved posts' });
            renderLeaderboard('epoch2-projects', ep.epoch2.top_projects, 'project', false, INITIAL_ROWS, { countries: ep.epoch2.countries, caption: 'Epoch 2 projects ranked by approved posts' });
            renderLeaderboard('epoch1-projects', ep.epoch1.top_projects, 'project', false, INITIAL_ROWS, { countries: ep.epoch1.countries, caption: 'Epoch 1 projects ranked by approved posts' });
        }

        function getPlatform(url) {
            if (!url) return { name: 'Nostr' };
            const lower = url.toLowerCase();
            if (lower.includes('twitter.com') || lower.includes('x.com')) return { name: 'X' };
            return { name: 'Nostr' };
        }

        // A ranking table. Each row opens to show up to 10 posts; rows past
        // initialCount stay hidden until "Show more".
        function renderLeaderboard(elementId, items, type, showMerchant = true, initialCount = 5, opts = {}) {
            const container = document.getElementById(elementId);
            if (!container) return;
            items = items || [];

            const noun = type === 'merchant' ? 'merchants' : 'projects';
            if (items.length === 0) {
                container.innerHTML = `<div class="lb-shell"><p class="board-empty">No ${noun} recorded for this epoch.</p></div>`;
                return;
            }

            const countryByFlag = {};
            (opts.countries || []).forEach(c => { countryByFlag[c.flag] = c.country; });
            const hasMore = items.length > initialCount;
            const tableId = `${elementId}-table`;

            const rows = items.map((item, index) => {
                const posts = item.posts || [];
                const hasPosts = posts.length > 0;
                const more = index >= initialCount ? ' is-more' : '';
                const detailId = `${elementId}-${index}`;
                const flag = flagOf(item.name);
                const country = countryByFlag[flag] || '';
                const nameHtml = `<span class="proj-name">${nameWithFlag(stripFlags(item.name), flag, country)}</span>`;

                const cell = hasPosts
                    ? `<button type="button" class="row-toggle" aria-expanded="false" aria-controls="${detailId}">
                           <span class="row-line">${nameHtml} <span class="chev" aria-hidden="true"></span></span>
                       </button>`
                    : nameHtml;

                // One row per visit (visits.js): an X post and its Nostr cross-post
                // share a row, paired on the same or next day (these carry dates
                // only). Epochs 1-3 have no merchant or date, so each post stays
                // its own row.
                const slug = name => String(name || '').replace(/[^\w\s-]/g, '').trim().toLowerCase().replace(/\s+/g, '-');
                const visits = groupVisits(posts.map(post => ({
                    project_name: type === 'merchant' ? post.project : item.name,
                    merchant_name: type === 'merchant' ? item.name : (showMerchant ? post.merchant : ''),
                    post_url: post.url,
                    timestamp: post.date ? `${String(post.date).slice(0, 10)} 00:00:00 UTC` : '',
                    classification: ''
                })));
                const postItems = visits.slice(0, DETAIL_ROWS).map((v, i) => {
                    const other = type === 'merchant' ? v.project : v.merchant;
                    const label = !other
                        ? `Post ${i + 1}`
                        : type === 'merchant'
                            ? `<a class="visit-project" href="profile.html?id=${encodeURIComponent(slug(stripFlags(other)))}">${nameWithFlag(stripFlags(other), flagOf(other), countryByFlag[flagOf(other)])}</a>`
                            : `<a href="merchant-profile.html?id=${encodeURIComponent(slug(other))}">${escapeHtml(other)}</a>`;
                    const context = type === 'merchant'
                        ? `${stripFlags(other || 'A project')} at ${stripFlags(item.name)}`
                        : `${stripFlags(item.name)}${other ? ` at ${other}` : ''}`;
                    const when = v.first ? formatDate(String(v.first).slice(0, 10)) : '';
                    return `
                        <li><div class="visit">
                            <span class="visit-main">${label}</span>
                            ${visitLinks(v, context)}
                            <span class="visit-when">${when}</span>
                        </div></li>`;
                }).join('');

                return `
                    <tr class="lb-row${more}">
                        <td class="rank num">${String(index + 1).padStart(2, '0')}</td>
                        <th scope="row" class="proj">${cell}</th>
                        <td class="r posts num">${formatNumber(item.count)}</td>
                    </tr>
                    ${hasPosts ? `
                    <tr class="detail" id="${detailId}" hidden>
                        <td colspan="3">
                            <ul class="visits dated" aria-label="${type === 'merchant' ? 'Posts at' : 'Posts by'} ${attrSafe(stripFlags(item.name))}">${postItems}</ul>
                            <div class="detail-links">
                                ${renderViewProfileButton(item.name, type)}
                                ${visits.length > DETAIL_ROWS ? renderViewAllButton(item.name, type, posts.length) : ''}
                            </div>
                        </td>
                    </tr>` : ''}`;
            }).join('');

            container.innerHTML = `
                <div class="lb-shell">
                    <table class="lb" id="${tableId}">
                        <caption class="visually-hidden">${escapeHtml(opts.caption || '')}. Open a row to see its posts.</caption>
                        <thead><tr>
                            <th scope="col">Rank</th>
                            <th scope="col">${type === 'merchant' ? 'Merchant' : 'Project'}</th>
                            <th scope="col" class="r">Posts</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                ${hasMore ? `<button type="button" class="btn lb-more" aria-controls="${tableId}" aria-expanded="false" data-count="${items.length - initialCount}">Show ${items.length - initialCount} more</button>` : ''}`;
        }

        function toggleShowMore(button) {
            const table = document.getElementById(button.getAttribute('aria-controls'));
            const open = !table.classList.contains('show-all');
            table.classList.toggle('show-all', open);
            button.setAttribute('aria-expanded', String(open));
            button.textContent = open ? 'Show fewer' : `Show ${button.dataset.count} more`;
            // Collapsing hides the extra rows; close any that were open.
            if (!open) {
                table.querySelectorAll('tr.is-more .row-toggle[aria-expanded="true"]').forEach(toggleLeaderboard);
            }
        }

        function toggleLeaderboard(toggle) {
            const open = toggle.getAttribute('aria-expanded') !== 'true';
            toggle.setAttribute('aria-expanded', String(open));
            document.getElementById(toggle.getAttribute('aria-controls')).hidden = !open;
        }

        // One listener for every ranking: open a row, show more rows
        document.getElementById('content').addEventListener('click', (e) => {
            const toggle = e.target.closest('.row-toggle');
            if (toggle) { toggleLeaderboard(toggle); return; }
            const more = e.target.closest('.lb-more');
            if (more) toggleShowMore(more);
        });

        // Load and render stats
        async function loadStats() {
            try {
                // Load all data sources
                const [epoch4Live, historical, members] = await Promise.all([
                    fetch('stats-epoch4.json?t=' + Date.now()).then(r => r.json()),
                    fetch('stats-historical.json?t=' + Date.now()).then(r => r.json()),
                    fetch('members.json?t=' + Date.now()).then(r => r.json()).catch(() => ({ members: [] }))
                ]);

                // Build project metadata from members.json
                members.members.forEach(member => {
                    // Match format used in stats: "Bitbiashara 🇰🇪"
                    const projectKey = `${member.name} ${member.flag}`;
                    projectMetadata[projectKey] = {
                        info_url: `profile.html?id=${member.id}`
                    };
                });

                renderDashboard(epoch4Live, historical);
            } catch (error) {
                console.error('Failed to load stats:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <p>The archive could not load.</p>
                        <p>The saved epoch files did not answer. Reload the page, or try again in a few minutes.</p>
                        <p class="muted mono">${escapeHtml(error.message)}</p>
                    </div>
                `;
            }
        }

        // Initialize - wait for includes to load first
        window.includesLoaded.then(() => loadStats());
    </script>
</body>
</html>
